name: Collect events

on:
  schedule:
    # Once a day at 07:41 UTC: 3:41 a.m. Eastern in summer, 2:41 a.m. in winter.
    # GitHub often starts scheduled runs late, so two backup times follow; a
    # backup does nothing once that day's collection has finished.
    - cron: '41 7 * * *'
    - cron: '13 9 * * *'
    - cron: '7 11 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  # Scheduled runs skip when today's (Eastern) finished list already exists.
  # A manual run always collects.
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: collector/data/widget-events.json
          sparse-checkout-cone-mode: false
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          node -e "
            const fs=require('fs');const et=d=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York'}).format(d);
            let done=false;try{const f=JSON.parse(fs.readFileSync('collector/data/widget-events.json','utf8'));done=et(new Date(f.generatedAt))===et(new Date());}catch{}
            console.log(done?'Today\'s collection already finished; skipping.':'No collection yet today; running.');
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'run='+(!done)+'\n');"
  collect:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The page cache (~2 MB) lives in the Actions cache, not in git, so the
      # repository doesn't grow with every run. If it's ever evicted, the next
      # run simply re-reads every page once (about 15 minutes).
      - name: Restore page cache
        uses: actions/cache/restore@v4
        with:
          path: collector/data/cache.json
          key: collector-cache-${{ github.run_id }}
          restore-keys: collector-cache-
      - name: Run collector
        run: node collector/collect.mjs
      # Second step: run the widget itself headless for the sources that are
      # slow or unreliable in readers' browsers (see collector/README.md).
      - name: Install Playwright (uses the runner's Google Chrome)
        continue-on-error: true
        working-directory: collector
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          google-chrome --version || npx playwright install --with-deps chromium
      - name: Run widget sources headless
        continue-on-error: true
        run: node collector/screen.mjs
      - name: Place events that have only a street address
        continue-on-error: true
        timeout-minutes: 6
        run: node collector/geocode.mjs
      # Last step: the widget screens and de-duplicates everything headless and
      # saves the finished list readers load (collector/finalize.mjs).
      - name: Build the finished events list
        continue-on-error: true
        timeout-minutes: 10
        run: node collector/finalize.mjs
      - name: Save page cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: collector/data/cache.json
          key: collector-cache-${{ github.run_id }}
      - name: Publish events file
        run: |
          git config user.name "events-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collector/data/events.json
          [ -f collector/data/widget-events.json ] && git add collector/data/widget-events.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update events $(date -u +%Y-%m-%dT%H:%MZ)"
            # main may have moved during a long run; replay this commit on top.
            git pull --rebase -X theirs origin main
            git push
          fi
