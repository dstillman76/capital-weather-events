name: Collect events

on:
  schedule:
    # Every 6 hours, at minute 23 (scheduled runs can start late; that's fine).
    - cron: '23 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The page cache (~2 MB) lives in the Actions cache, not in git, so the
      # repository doesn't grow with every run. If it's ever evicted, the next
      # run simply re-reads every page once (about 15 minutes).
      - name: Restore page cache
        uses: actions/cache/restore@v4
        with:
          path: collector/data/cache.json
          key: collector-cache-${{ github.run_id }}
          restore-keys: collector-cache-
      - name: Run collector
        run: node collector/collect.mjs
      - name: Save page cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: collector/data/cache.json
          key: collector-cache-${{ github.run_id }}
      - name: Publish events file
        run: |
          git config user.name "events-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collector/data/events.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update events $(date -u +%Y-%m-%dT%H:%MZ)"
            # main may have moved during a long run; replay this commit on top.
            git pull --rebase -X theirs origin main
            git push
          fi
