name: Probe sources

# Quick check (about a minute) that each source answers GitHub's servers.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node collector/collect.mjs --probe
      # Do sites that refuse the browser proxy answer GitHub's servers? A
      # refusal (403) here is respected: such a site is not added.
      - name: Reachability of proxy-blocked calendars
        run: |
          for u in https://www.gaithersburgmd.gov/robots.txt https://www.gaithersburgmd.gov/recreation/events \
                   https://www.herndon-va.gov/robots.txt https://www.leesburgva.gov/robots.txt \
                   https://www.montgomerycountymd.gov/robots.txt https://www.howardcountymd.gov/robots.txt \
                   https://patch.com/maryland/gaithersburg/calendar https://patch.com/robots.txt \
                   https://fairfax.usedirect.com/FairfaxFCPAWeb/ACTIVITIES/Search.aspx?category_name=NATURE; do
            code=$(curl -s -o /tmp/b -w '%{http_code}' -A 'CapitalWeatherEventsCollector/1.0 (+https://github.com/dstillman76/capital-weather-events)' --max-time 20 "$u" || true)
            echo "::notice::$code $u $(head -c 120 /tmp/b 2>/dev/null | tr '\n\r' '  ')"
          done
      - name: FindLocal record fields (keyless playground, no quota)
        run: |
          curl -s --max-time 30 -A 'CapitalWeatherEventsCollector/1.0' 'https://findlocal.community/api/playground/events?near=38.9319,-77.0607&radius_km=3' -o /tmp/fl.json || true
          node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/fl.json','utf8'));const ev=j.events||j.data||j.results||j;const a=Array.isArray(ev)?ev:[];console.log('::notice::keys '+Object.keys(a[0]||j).join(','));for(const e of a.slice(0,5)){const u=Object.fromEntries(Object.entries(e).filter(([k,v])=>/url|link|id|slug|source/i.test(k)));console.log('::notice::'+(e.title||'').slice(0,40)+' '+JSON.stringify(u).slice(0,600))}" || echo "::notice::raw $(head -c 300 /tmp/fl.json | tr '\n' ' ')"
