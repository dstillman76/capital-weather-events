name: Assess FindLocal (manual, one-off)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node collector/tools/assess-findlocal.mjs
        env:
          FINDLOCAL_API_KEY: ${{ secrets.FINDLOCAL_API_KEY }}
      - name: Save result to the findlocal-assess branch (not main)
        run: |
          mv assess/findlocal.json /tmp/findlocal.json
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git checkout --orphan findlocal-assess
          git rm -rfq .
          cp /tmp/findlocal.json findlocal.json
          git add findlocal.json
          git commit -qm 'FindLocal assessment data'
          git push -f origin findlocal-assess
