name: Assess FindLocal (manual, one-off)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node collector/tools/assess-findlocal.mjs
        env:
          FINDLOCAL_API_KEY: ${{ secrets.FINDLOCAL_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: findlocal-assess
          path: assess/findlocal.json
          retention-days: 3
