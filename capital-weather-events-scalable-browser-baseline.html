function clean(x){

}
// Keep third-party event copy to a short, readable excerpt.
function descriptionExcerpt(value,maxWords=50){
 const full=clean(value);
 if(!full)return {text:'',truncated:false};
 const words=full.split(/\s+/);
 if(words.length<=maxWords){
  // Feeds sometimes supply an already-cut excerpt (e.g. a 300-character cap).
  // Mark text without terminal punctuation as visibly incomplete.
  const incomplete=!/[.!?…][\"'’”)]*$/.test(full);
  return {text:incomplete?full.replace(/[\s.\u2026]+$/,'')+'…':full,truncated:incomplete};
 }
 const head=words.slice(0,maxWords).join(' ');
 // Prefer a complete sentence if one ends reasonably near the word limit.
 const endings=[...head.matchAll(/[.!?](?=\s|$)/g)];
 const last=endings.length?endings[endings.length-1].index+1:0;
 const excerpt=last>=Math.floor(head.length*0.6)?head.slice(0,last):head;
 return {text:excerpt.replace(/[\s.\u2026]+$/,'')+'…',truncated:true};
}

/* Address parsing: use a confirmed city/state pair, not a guess. */

const CITY_STATE=
 /([A-Za-z][A-Za-z.' -]{1,45}?),\s*(DC|MD|VA|Maryland|Virginia|District of Columbia)\s*(\d{5})?\b/i;

function parseAddress(text){
 const s=clean(text).replace(/\s+/g,' ');
 // Real-world addresses may omit the comma before the state abbreviation.
 // Take the final comma-delimited segment, never the street or venue name.
 const segments=s.split(',').map(x=>x.trim()).filter(Boolean);
 for(let i=segments.length-1;i>=0;i--){
  const seg=segments[i];
  const m=seg.match(/^(.+?)\s*,?\s+(DC|MD|VA|Maryland|Virginia|District of Columbia)\b(?:\s+\d{5}(?:-\d{4})?)?$/i);
  if(m){
   const city=clean(m[1]);
   const st=stateCode(m[2]);
   if(city&&st&&!/\d/.test(city)&&city.length<55)return {city,state:st};
  }
  const st=stateCode(seg.replace(/\s+\d{5}(?:-\d{4})?$/,''));
  if(st&&i>0){
   const city=segments[i-1];
   if(city&&!/\d/.test(city)&&city.length<55)return {city,state:st};
  }
 }
 return null;
}

function applyAddress(e){
 const parsed=parseAddress(e.address);
 if(parsed){
  if(!e.city)e.city=parsed.city;
  if(!e.state)e.state=parsed.state;
 }
 if(e.state==='DC'&&!e.city)e.city='Washington';
 if(e.city&&!e.county)
  e.county=countyFor(e.city,e.state);
}

/* Outdoor screening */

const EXCLUDE=
 /\b(?:trivia|karaoke|happy hour|hoppy hour|restaurant week|webinar|virtual|comedy club|cocktail class|private party|indoor movie|film screening|book signing)\b/i;

const OUTDOOR=
 /\b(?:walk with me|walk\/run|run\/walk|battle of the bands|public art walking tour|outdoor|open.air|festival|fair|farmers.? market|flea market|craft market|pumpkin|corn maze|hayride|haunted trail|trick.or.treat|ghost tour|ghost walk|walking tour|garden tour|hike|nature walk|birdwatch|park cleanup|trail run|5k|10k|marathon|fun run|bike ride|cycling|kayak|canoe|paddle|sailing|boat|parade|fireworks|block party|football|soccer|baseball|harvest fest|orchard|skate|skating|waterfront|street fest)\b/i;

const OUTDOOR_CONTEXT=
 /\b(?:outdoors|outdoor event|on the lawn|on the plaza|on the pier|in the park|outdoor performance|under the stars|outdoor concert|outdoor activities)\b/i;

const INDOOR=
 /\b(?:theater|theatre|cinema|nightclub|ballroom|auditorium|indoor arena)\b/i;

const INDOOR_VENUE=
 /\b(?:politics\s*(?:and|&)\s*prose|bookstore|bookshop|booksellers?|publick playhouse|library|libraries|museum|art gallery|cinema|movie theater|theatre|theater|auditorium|ballroom|nightclub|comedy club|conference center|convention center|indoor arena)\b/i;
const EXPLICIT_OUTDOOR=
 /\b(?:outdoors?|open.air|on the (?:lawn|plaza|pier|patio)|in the park|outside|under the stars|parking lot|sidewalk|courtyard|rooftop)\b/i;
function outdoor(e){
 const venueText=[e.venue,e.address].filter(Boolean).join(' ');
 const explicit=EXPLICIT_OUTDOOR.test(e.title+' '+e.description);
 if(INDOOR_VENUE.test(venueText)&&!explicit)return false;
 if(EXCLUDE.test(e.title)&&!explicit)return false;
 if(INDOOR.test(e.title)&&!OUTDOOR_CONTEXT.test(e.description))
  return false;
 if(e.sourceOutdoor===true)return true;
 if(/\b(?:5k|8k|10k|marathon|road race|fun run|walking tour|farmers market)\b/i.test(e.title))return true;
 if(OUTDOOR.test(e.title))return true;
 if(OUTDOOR_CONTEXT.test(e.description))return true;
 if(/\b(?:outdoor|parks|nature|boating|hiking)\b/i.test(e.categories))
  return true;
 return false;
}
function category(e){
 const s=(e.title+' '+e.categories).toLowerCase();
 if(/market/.test(s))return 'market';
 if(/festival|fair|parade|block party/.test(s))return 'festival';
 if(/boat|kayak|sail|paddle/.test(s))return 'water';
 if(/5k|10k|run|race|marathon|yoga|fitness|cycling/.test(s))
  return 'fitness';
 if(/football|soccer|baseball|sports|battle of the bands/.test(s))return 'sports';
 if(/concert|music|outdoor movie/.test(s))return 'music';
 if(/nature|hike|park|trail|garden|ghost tour|walking tour|public art tour/.test(s))
  return 'nature';
 if(/pumpkin|kids|family|children|trick.or.treat|hayride/.test(s))
  return 'family';

}

/* Upcoming 7-day occurrences */

const WEEKDAYS={
 sunday:0,monday:1,tuesday:2,wednesday:3,
 thursday:4,friday:5,saturday:6
};

function recurrenceDays(text){
 const s=norm(text);
 if(/\b(?:every day|daily|seven days a week)\b/.test(s))
  return [0,1,2,3,4,5,6];

 const result=new Set();
 if(/\b(?:every weekend|weekends only)\b/.test(s)){
  result.add(0);result.add(6);
 }
 if(/\b(?:recurr|weekly|every|each|on)\b/.test(s)){
  for(const [name,num] of Object.entries(WEEKDAYS)){
   if(new RegExp('\\b'+name+'s?\\b','i').test(s))
    result.add(num);
  }
 }
 return [...result];
}

function occurrences(start,end,recurrence){
 if(!start)return [];
 const last=end||start;
 const recurringWeekdays=recurrenceDays(recurrence);
 const result=[];
 // Iterate actual ISO calendar dates, never weekday numbers.
 for(const iso of days){
  if(iso<start||iso>last)continue;
  const weekday=new Date(iso+'T12:00:00Z').getUTCDay();
  if(start===last||(!recurringWeekdays.length&&!/\b(?:weekly|every (?:mon|tues|wednes|thurs|fri|satur|sun)day)\b/i.test(recurrence||''))||recurringWeekdays.includes(weekday))
   result.push(iso);
 }
 return result;
}

function dateInfo(text){
 const s=clean(text);
 const iso=[...s.matchAll(
  /\b(?:20\d\d-\d{1,2}-\d{1,2}|\d{1,2}\/\d{1,2}\/20\d\d)\b/g
 )].map(x=>parseDate(x[0])).filter(Boolean);

 const months=[...s.matchAll(
  /\b(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\s+\d{1,2},?\s+20\d\d/gi
 )].map(x=>parseDate(x[0])).filter(Boolean);

 const dates=[...new Set([...iso,...months])];
 if(!dates.length)return {start:'',end:''};
 dates.sort();
 return {start:dates[0],end:dates[1]||dates[0]};
}

/* Network and HTML helpers */

async function fetchText(url,timeout=10000){
 const urls=[PROXY+url,BACKUP_PROXY+encodeURIComponent(url)];
 let lastError;
 for(let i=0;i<urls.length;i++){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeout);
  try{
   const r=await fetch(urls[i],{signal:controller.signal,credentials:'omit'});
   if(!r.ok)throw Error('HTTP '+r.status);
   const body=await r.text();
   if(!body.trim())throw Error('Empty response');
   return body;
  }catch(err){lastError=err;
   // Try a second CORS proxy on gateway errors or timeouts. A 403
   // from a publisher is not a signal to bypass its access policy.
   if(/HTTP 403|HTTP 401/.test(err.message))break;
  }finally{clearTimeout(timer)}
 }
 throw lastError||Error('Request failed');
}

function docFrom(html){

function textOf(node){

function labeledText(doc,label){

 for(const el of doc.querySelectorAll(
  'p,li,td,dd,div,span'
 )){
  if(el.children.length>4)continue;
  const t=textOf(el);

function schemas(doc){

  if(!v||typeof v!=='object')return;
  if(Array.isArray(v)){v.forEach(visit);return}

  if(v.mainEntity)visit(v.mainEntity);
  if(v.itemListElement)visit(v.itemListElement);
 }
 for(const script of doc.querySelectorAll(
  'script[type="application/ld+json"]'

  try{visit(JSON.parse(script.textContent))}catch{}
 }

  (Array.isArray(x['@type'])?x['@type']:[x['@type']])
   .some(t=>/Event$/i.test(String(t||'')))

function schemaDateTime(x){
 if(!x)return {date:'',time:''};
 const raw=String(x);

  const dt=new Date(raw);
  if(isNaN(dt))return {date:'',time:''};
  const parts=new Intl.DateTimeFormat('en-US',{
   timeZone:'America/New_York',
   year:'numeric',month:'2-digit',day:'2-digit',
   hour:'2-digit',minute:'2-digit',hourCycle:'h23'
  }).formatToParts(dt);
  const p=Object.fromEntries(
   parts.map(z=>[z.type,z.value])
  );
  return {
   date:p.year+'-'+p.month+'-'+p.day,
   time:p.hour+':'+p.minute
  };

  date:parseDate(raw.slice(0,10)),
  time:parseTime(raw.split('T')[1]||'')

}

 if(!result.city){
  const parsed=parseAddress(visible.slice(0,3500));
  if(parsed){
   result.city=parsed.city;
   if(!result.state)result.state=parsed.state;
  }
 }
 return result;
}

/* RSS candidates: preserve entries for detail-page date checks. */

function parseRSS(xml,feed){
 const doc=new DOMParser().parseFromString(xml,'application/xml');
 if(doc.querySelector('parsererror'))throw Error('Invalid XML');
 const items=[...doc.querySelectorAll('item')];
 if(!items.length)throw Error('No RSS items');
 const get=(el,name)=>clean(el.getElementsByTagName(name)[0]?.textContent);
 const candidates=[];
 let rejectedOutdoor=0,missingLinks=0,withRSSDates=0;
 for(const item of items){
  const title=get(item,'title');
  const url=safeURL(get(item,'link'));
  if(!title||!url){missingLinks++;continue}
  // WordPress and Simpleview RSS feeds often put richer event information
  // in content:encoded or custom namespace tags, not description.
  const raw=get(item,'description');
  const rich=[...item.children].filter(x=>
   /^(encoded|content|event_start_date|event_end_date|start_date|end_date|start|end|date)$/i.test(x.localName||'')
  ).map(x=>clean(x.textContent)).join(' ');
  const description=textOf(docFrom(raw+' '+rich).body);
  const categories=[...item.getElementsByTagName('category')]
   .map(x=>clean(x.textContent)).join(', ');
  const base={
   title,url,source:feed.name,description,categories,
   venue:'',address:'',city:feed.city||'',
   county:feed.county,state:feed.state,
   time:'',endTime:'',lat:null,lng:null
  };
  if(!outdoor(base)){rejectedOutdoor++;continue}
  const di=dateInfo(description);
  const times=timeRange(description);
  base.time=times.start;base.endTime=times.end;
  const dates=occurrences(di.start,di.end,description);
  if(dates.length)withRSSDates++;
  candidates.push({
   ...base,dates,needsDetail:true,
   dateEvidence:di.start?'RSS description':''
  });
 }
 return {
  candidates,total:items.length,
  rejectedOutdoor,missingLinks,withRSSDates
 };
}

/* Calendar discovery: supplement RSS with dated, paginated event grids.
 * Calendar links are discovered from returned HTML; JavaScript-only grids
 * may be inaccessible to this browser-only prototype. */
function calendarURL(source,skip){
 const u=new URL(source.base);
 u.searchParams.set('view','grid');
 u.searchParams.set('sort','date');
 u.searchParams.set('filter_daterange[start]',firstDay);
 u.searchParams.set('filter_daterange[end]',lastDay);
 if(skip)u.searchParams.set('skip',String(skip));
 if(source.category)u.searchParams.set('filter_categories[0]',String(source.category));
 return u.href;
}
function calendarEntries(html,source){
 const doc=docFrom(html);
 const entries=[];
 const seen=new Set();
 const allowedHost=new URL(source.base).hostname.replace(/^www\./,'');
 const links=[...doc.querySelectorAll('a[href]')];
 for(const a of links){
  let url;
  try{url=new URL(a.getAttribute('href'),source.base)}catch{continue}
  if(url.hostname.replace(/^www\./,'')!==allowedHost)continue;
  if(!/^\/event\//i.test(url.pathname)&&!/^\/events\/[^/]+\/?$/i.test(url.pathname))continue;
  if(/^\/events\/?$/i.test(url.pathname))continue;
  const href=url.origin+url.pathname;
  if(seen.has(href))continue;
  const container=a.closest('article,li,[class*="event-card"],[class*="eventCard"],[class*="eventItem"],[class*="event-item"],[class*="listing"],[class*="card"]')||a.parentElement;
  if(!container)continue;
  const title=clean(a.querySelector('h2,h3,h4,[class*="title"]')?.textContent||
   container.querySelector('h2,h3,h4,[class*="title"]')?.textContent||a.textContent);
  if(title.length<5||title.length>135||/^(details|learn more|read more|view event)$/i.test(title))continue;
  const description=textOf(container).slice(0,1200);
  const base={title,url:href,source:source.name,description,categories:'',
   venue:'',address:'',city:source.city||'',county:source.county,state:source.state,
   time:'',endTime:'',lat:null,lng:null,sourceOutdoor:!!source.category};
  // Calendar categories count as outdoor evidence; other calendars still screened.
  if(!outdoor(base))continue;
  seen.add(href);
  const time=timeRange(description);
  base.time=time.start;base.endTime=time.end;
  const di=dateInfo(description);
  const dateFromCard=container.querySelector('time[datetime]')?.getAttribute('datetime')||'';
  let dates=occurrences(di.start,di.end,description);
  const date=parseDate(dateFromCard);
  if(date&&days.includes(date))dates=[date];
  // Calendar is explicitly date-filtered, but do not invent an occurrence date
  // when it is absent: the detail page must verify it.
  entries.push({...base,dates,needsDetail:true,dateEvidence:'dated calendar'});

}
async function loadCalendar(source){
 const candidates=[];
 const seen=new Set();
 let pages=0;
 let error='';
 // Simpleview grids commonly paginate in blocks of 12.
 for(let skip=0;skip<=72;skip+=12){
  try{
   const html=await fetchText(calendarURL(source,skip),12000);
   const found=calendarEntries(html,source);
   pages++;
   let newCount=0;
   for(const c of found){
    if(seen.has(c.url))continue;
    seen.add(c.url);candidates.push(c);newCount++;
   }
   if(newCount===0)break;
  }catch(e){error=e.message;break}
 }
 state.reports.push({source:source.name+' calendar',ok:pages>0,
  candidates:candidates.length,total:candidates.length,count:0,
  pages,error});
 return candidates;
}

/* Verified alternative to Visit Prince William's inaccessible ImGoing embed:
 * Prince William County's own public event calendar. */
/* Prince William County publishes dated event listings in HTML. Match the
 * dated listing containers rather than relying on individual text nodes. */
function princeWilliamEntries(html,source){
 const doc=docFrom(html),candidates=[],seen=new Set();
 const base='https://www.pwcva.gov';
 const dateRE=/\b20\d\d-\d\d-\d\d\b/;
 const linkRE=/\/(?:events|event)\/[^/?#]+/i;
 function add(title,iso,context,url,time='',venue='',address=''){
  title=clean(title);iso=parseDate(iso);
  if(!days.includes(iso)||title.length<5||title.length>170)return;
  const key=norm(title)+'|'+iso;
  if(seen.has(key))return;
  const c={title,url:url||base+'/events',source,
   description:clean(context).slice(0,1300),categories:'',
   venue,address,city:'',county:'Prince William County',state:'VA',
   time:parseTime(time),endTime:'',dates:[iso],
   needsDetail:!!url&&url!==base+'/events',
   dateEvidence:'Prince William County dated listing'};
  if(!outdoor(c))return;
  seen.add(key);candidates.push(c);
 }
 // Handle event-card markup in multiple Drupal versions, including
 // date/title fields that are siblings rather than descendants.
 for(const block of doc.querySelectorAll(
  'article, .views-row, [class*="event-item"], [class*="event-card"], [class*="event-list"], [class*="calendar-event"], [data-event-id]'
  )){
  const txt=textOf(block).slice(0,2500);
  const iso=txt.match(dateRE)?.[0]||
   block.querySelector('time[datetime]')?.getAttribute('datetime')?.slice(0,10);
  if(!iso||!days.includes(iso))continue;
  const anchor=[...block.querySelectorAll('a[href]')].find(a=>{
   try{return linkRE.test(new URL(a.href,base).pathname)}catch{return false}
  });
  const title=clean(anchor?.textContent||
   block.querySelector('h2,h3,h4,[class*="title"]')?.textContent||'');
  let url='';
  try{if(anchor)url=new URL(anchor.getAttribute('href'),base).href}catch{}
  const time=txt.match(/\b\d{1,2}:\d\d\s*[AP]M\b/i)?.[0]||'';
  add(title,iso,txt,url,time);
 }
 // Some PWC pages render calendar rows as bare text interleaved with
 // headings. Read adjacent DOM nodes, not the whole page as one event.
 for(const el of doc.querySelectorAll('time[datetime], [class*="date"], [class*="Date"]')){
  const iso=(el.getAttribute('datetime')||textOf(el)).match(dateRE)?.[0];
  if(!iso||!days.includes(iso))continue;
  let block=el;
  for(let i=0;i<5&&block;i++,block=block.parentElement){
   const txt=textOf(block);
   if(txt.length<40||txt.length>1200)continue;
   const a=[...block.querySelectorAll('a[href]')].find(a=>linkRE.test(a.getAttribute('href')||''));
   const title=clean(a?.textContent||block.querySelector('h3,h4')?.textContent||'');
   if(title.length<5)continue;
   let url='';
   try{if(a)url=new URL(a.getAttribute('href'),base).href}catch{}
   add(title,iso,txt,url,txt.match(/\b\d{1,2}:\d\d\s*[AP]M\b/i)?.[0]||'');
   break;
  }
 }
 // If the proxy supplies a text-only version of the county listing,
 // parse the explicit date / title / time / address sequence.
 const main=doc.querySelector('main')||doc.body;
 const lines=(main?.innerText||main?.textContent||'')
  .split(/\n+/).map(x=>clean(x)).filter(Boolean);
 for(let i=0;i<lines.length;i++){
  if(!/^20\d\d-\d\d-\d\d$/.test(lines[i])||!days.includes(lines[i]))continue;
  const title=lines[i+1]||'';
  const next=(lines.slice(i+2,i+6)).join(' ');
  const time=next.match(/\b\d{1,2}:\d\d\s*[AP]M\b/i)?.[0]||'';
  const address=lines[i+3]||'';
  add(title,lines[i],next,'',time,'',address);
 }
 return candidates;
}
/* Fetch large Prince William JSON independently of the small-page HTML helper.
 * Direct CORS first; then proxy fallbacks with individual diagnostics. */
async function fetchPrinceWilliamJSON(url){
 const attempts=[
  {name:'Direct county JSON',url,timeout:22000},
  {name:'Primary CORS proxy',url:PROXY+url,timeout:45000},
  {name:'Backup CORS proxy',url:BACKUP_PROXY+encodeURIComponent(url),timeout:45000}
 ];
 const failures=[];
 for(const attempt of attempts){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort('timeout after '+attempt.timeout/1000+'s'),attempt.timeout);
  try{
   const response=await fetch(attempt.url,{signal:controller.signal,credentials:'omit',cache:'no-store'});
   if(!response.ok)throw Error('HTTP '+response.status);
   const raw=await response.text();
   if(!raw.trim())throw Error('Empty response');
   let parsed;
   try{parsed=JSON.parse(raw)}catch(e){throw Error('Invalid JSON ('+raw.length+' characters)')}
   if(!Array.isArray(parsed?.result?.data?.allNodeEvent?.edges))throw Error('Missing allNodeEvent.edges');
   return {data:parsed,transport:attempt.name,bytes:raw.length,failures};
  }catch(err){
   const detail=controller.signal.aborted?'Timed out after '+attempt.timeout/1000+'s':
    (err?.name==='AbortError'?'Request aborted':err?.message||String(err));
   failures.push(attempt.name+': '+detail);
   // Authentication/permission errors are not automatically retried via proxies.
   if(/HTTP 401|HTTP 403/.test(detail))break;
  }finally{clearTimeout(timer)}
 }
 throw Error(failures.join(' | '));
}
/* Prince William County's actual Gatsby event dataset.
 * Verified against the county's 6.3 MB page-data.json: allNodeEvent.edges[].node
 * contains 1,217 records, including 13 dated October 23–29, 2026.
 * Do not scrape the empty client-rendered calendar HTML. */
async function loadPrinceWilliamImGoing(){
 const source='Visit Prince William (ImGoing)';
 const base='https://api.imgoingcalendar.com/api/visitors/PrinceWilliamCo/events';
 const candidates=[];let scanned=0,pages=0,transport='';
 try{
  // Each page is small. The site orders results by their next occurrence.
  // Keep a bounded page count so this source cannot monopolize loading.
  for(let page=1;page<=12;page++){
   const url=base+'?page='+page+'&limit=16&category=All&source=google&useFuzzyQuery=true&searchFields=name%2Caddress';
   let records=null,errors=[];
   for(const attempt of [{label:'direct',url},{label:'primary proxy',url:PROXY+url},{label:'backup proxy',url:BACKUP_PROXY+encodeURIComponent(url)}]){
    const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),10000);
    try{
     const r=await fetch(attempt.url,{signal:ctrl.signal,credentials:'omit'});
     if(!r.ok)throw Error('HTTP '+r.status);
     const parsed=JSON.parse(await r.text());
     records=Array.isArray(parsed)?parsed:(parsed?.events||parsed?.data?.events||parsed?.data?.items||parsed?.results);
     if(!Array.isArray(records))throw Error('Unexpected response shape');
     transport=attempt.label;break;
    }catch(err){errors.push(attempt.label+': '+(err.message||String(err)))}finally{clearTimeout(timer)}
   }
   if(!records){if(page===1)throw Error(errors.join(' | '));break}
   pages++;scanned+=records.length;
   if(!records.length)break;
   let earliest=null;
   for(const n of records){
    if(n.isCancelled||n.isRemoved||n.isBlocked)continue;
    const slots=Array.isArray(n.eventTimes)&&n.eventTimes.length?n.eventTimes:[{startTime:n.startTime,endTime:n.endTime}];
    const description=textOf(docFrom(n.description||'').body).slice(0,1600);
    const address=n.address?.address||'';
    const components=n.address?.addressComponents||[];
    const countyPart=components.find(c=>(c.types||[]).includes('administrative_area_level_2'));
    const county=countyPart?.long_name||countyPart?.longText||'Prince William County';
    const cityPart=components.find(c=>(c.types||[]).includes('locality'));
    const city=n.address?.cityName||cityPart?.long_name||cityPart?.longText||'';
    const candidate={title:clean(n.title||n.name||''),source,
     url:n.eventLink||n.ticketUri||n.hostLink||'https://www.visitpwc.com/events/',
     description,venue:clean(n.venue||n.venueInfo?.name||''),address,city:clean(city),
     state:'VA',county:clean(county),categories:(n.categories||[]).map(c=>typeof c==='string'?c:c.name||'').join(' '),
     dates:[],dateEvidence:'Visit Prince William event occurrence',needsDetail:false};
    if(!outdoor(candidate))continue;
    for(const slot of slots){
     const start=slot.startTime||n.startTime;
     if(!start)continue;
     const iso=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(start));
     if(!/^\d{4}-\d{2}-\d{2}$/.test(iso)||!days.includes(iso))continue;
     // Do not treat multi-month recurrence ranges as continuous daily events.
     const end=slot.endTime||n.endTime;
     if(end&&new Date(end)-new Date(start)>36*3600000)continue;
     candidates.push(createEvent({...candidate,time:parseTime(start),endTime:parseTime(end)},iso,candidate.dateEvidence));
    }
   }
   // The feed sorts by next event time; stop once a full page lies beyond our window.
   const sorted=records.map(n=>n._sortTime||Date.parse(n.startTime||'')).filter(Number.isFinite);
   if(sorted.length){earliest=Math.min(...sorted);if(earliest>Date.parse(days[days.length-1]+'T23:59:59-04:00'))break}
   if(records.length<16)break;
  }
  state.reports.push({source,ok:true,candidates:candidates.length,count:candidates.length,total:scanned,
   detail:pages+' pages · '+scanned+' records · '+transport});
  return candidates;
 }catch(err){state.reports.push({source,ok:false,error:err.message});return []}
}

/* Candidate enrichment before final inclusion */

function createEvent(candidate,iso,confidence){
 const e={
  ...candidate,
  id:candidate.source+'|'+candidate.url+'|'+iso+(candidate.occurrenceTime?'|'+candidate.occurrenceTime+'|'+norm(candidate.venue):''),
  date:parseDate(iso),confidence,
  category:category(candidate)
 };
 delete e.dates;
 delete e.needsDetail;
 return e;
}

function mergePage(candidate,page){
 if(page.venue&&!candidate.venue)candidate.venue=page.venue;
 if(page.address)candidate.address=page.address;
 if(page.city)candidate.city=page.city;
 if(page.state)candidate.state=page.state;
 if(page.time)candidate.time=page.time;
 if(page.endTime)candidate.endTime=page.endTime;
 if(page.lat)candidate.lat=page.lat;
 if(page.lng)candidate.lng=page.lng;
 applyAddress(candidate);

 let dates=candidate.dates||[];
 const confirmed=occurrences(
  page.start,page.end,page.recurrence
 );
 if(confirmed.length)dates=confirmed;
 else if(page.start&&page.end){
  // A dated event page can invalidate RSS-derived dates.
  dates=dates.filter(x=>x>=page.start&&x<=page.end);
 }
 else if(page.start&&!page.end){
  // Single-date page is authoritative.
  dates=days.includes(page.start)?[page.start]:[];
 }
 if(page.nextEvent){
  // Do not fabricate occurrences earlier than the organizer's next event.
  dates=dates.filter(x=>x>=page.nextEvent);
 }
 candidate.dates=dates;
 return confirmed.length?'event page schedule':
  candidate.dateEvidence||'RSS schedule';
}

async function processCandidate(candidate){
 let confidence=candidate.dateEvidence||'RSS schedule';
 try{
  state.attempted++;
  const html=await fetchText(candidate.url,9000);
  if(html.length>1800000)throw Error('Page too large');
  const page=eventPageData(html);
  confidence=mergePage(candidate,page);
  state.enriched++;
 }catch{
  state.failed++;
  applyAddress(candidate);
 }
 return (candidate.dates||[])
  .map(iso=>parseDate(iso)).filter(iso=>days.includes(iso))
  .map(iso=>createEvent(candidate,iso,confidence));
}

    lat:null,lng:null,dates,needsDetail:true,dateEvidence:dates.length?'calendar card date':''};

function bidDate(text){
 const d=dateInfo(text);if(d.start&&days.includes(d.start))return d.start;
 const m=clean(text).match(/\b(Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\s+(\d{1,2})\b/i);
 const r=clean(text).match(/\b(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\b/i);
 if(!m&&!r)return '';
 const month=(m?m[1]:r[2]).slice(0,3).toLowerCase(),day=+(m?m[2]:r[1]);
 return days.find(iso=>{const x=new Date(iso+'T12:00:00Z');return x.getUTCDate()===day&&x.toLocaleString('en-US',{month:'short',timeZone:'UTC'}).toLowerCase()===month})||'';
}

/* Reston Town Center: event detail pages have reliable Event Date fields.
   Calendar cards are not required to contain their own date. */
async function loadReston(source){
 const report={source:source.name,ok:true,count:0,candidates:0,detail:''};
 state.reports.push(report);
 const urls=new Set();let failures=0,excluded=0;let noDate=0,outOfRange=0,noTitle=0;const examples=[];
 const addUrl=href=>{try{const u=new URL(href,source.url);
   if(u.hostname.replace(/^www\./,'')==='restontowncenter.com' &&
      /^\/calendar-events\/[^/?#]+\/?$/.test(u.pathname))urls.add(u.href);
  }catch{}};
 try{
  // Harvest all event detail links, whether or not their cards show a date.
  const doc=docFrom(await fetchText(source.url,11000));
  doc.querySelectorAll('a[href]').forEach(a=>addUrl(a.getAttribute('href')));
 }catch(e){report.detail='Calendar fetch failed: '+e.message+'; trying known event pages';}
 // Limited fallback for events independently verified on the public calendar.
 // The calendar remains the primary source, so future events can be discovered.
 addUrl('/calendar-events/dj-dance-party');
 addUrl('/calendar-events/trick-or-treat-on-market-street');
 const candidates=[];
 const selected=[...urls].slice(0,65);
 // Prioritize known near-term links; don't make all detail requests at once.
 selected.sort((a,b)=>Number(/dj-dance-party|trick-or-treat-on-market-street/.test(b))-Number(/dj-dance-party|trick-or-treat-on-market-street/.test(a)));
 const parseOne=async url=>{
  try{
   const awaitedHtml=await fetchText(url,8500);
   const d=docFrom(awaitedHtml);
   const body=clean(d.body?.textContent||'');
   const marker=body.search(/\bEvent Date\b/i);
   const dated=marker>=0?body.slice(marker,marker+220):'';
   const structured=eventPageData(awaitedHtml);
   const schema=schemas(d)[0];
   const iso=structured.start||dateInfo(dated).start||dateInfo(body.slice(0,1400)).start;
   if(!iso){noDate++;if(examples.length<3)examples.push('No date: '+url.split('/').filter(Boolean).pop()+' [date excerpt: '+dated.slice(0,95)+']');return null}
   if(!days.includes(iso)){outOfRange++;if(examples.length<3)examples.push('Outside range '+iso+': '+url.split('/').filter(Boolean).pop());return null}
   const title=clean(schema?.name||d.querySelector('h1,h2')?.textContent||'');
   if(!title||title.length>160){noTitle++;return null}
   const desc=clean(d.querySelector('h3')?.textContent||d.querySelector('meta[name="description"]')?.content||body.slice(0,500));
   const times=timeRange(dated);
   const event={title,url,source:source.name,description:desc,
    categories:'',venue:'Reston Town Center',address:'',city:source.city,
    county:source.county,state:source.state,time:structured.time||times.start,endTime:structured.endTime||times.end,
    lat:null,lng:null,dates:[iso],needsDetail:false,dateEvidence:'Reston event detail page'};
   if(!outdoor(event)){excluded++;return null}
   return event;
  }catch(e){failures++;return null}
 };
 // Cap requests to protect loading time; always examine the known near-term pages.
 for(let i=0;i<Math.min(selected.length,30);i+=6){
  const batch=await Promise.all(selected.slice(i,i+6).map(parseOne));
  for(const event of batch)if(event)candidates.push(event);
 }
 report.candidates=candidates.length;
 report.detail=(report.detail?report.detail+' · ':'')+selected.length+' event URLs · '+
  candidates.length+' eligible · '+noDate+' no date · '+outOfRange+' outside 7 days · '+noTitle+' missing title · '+excluded+' not outdoor · '+failures+' detail fetch failures'+(examples.length?' | Examples: '+examples.join(' / '):'');
 if(failures && !candidates.length)report.ok=false;
 return candidates;
}

/* Georgetown BID: The Events Calendar public REST API, bounded to seven days. */
async function loadGeorgetown(source){
 const report={source:source.name,ok:true,count:0,candidates:0,detail:''};
 state.reports.push(report);
 const results=[],seen=new Set();let screened=0,notOutdoor=0,invalid=0,pages=0;
 try{
  const endpoint='https://www.georgetowndc.com/wp-json/tribe/events/v1/events';
  for(let page=1;page<=3;page++){
   const params=new URLSearchParams({per_page:'50',page:String(page),
    start_date:days[0]+' 00:00:00',end_date:days[days.length-1]+' 23:59:59'});
   const payload=JSON.parse(await fetchText(endpoint+'?'+params.toString(),9000));
   pages++;
   const events=Array.isArray(payload.events)?payload.events:[];
   for(const item of events){
    screened++;
    const title=clean(item.title||'');
    const iso=String(item.start_date||'').slice(0,10);
    const url=item.url;
    if(!title||!days.includes(iso)||!url){invalid++;continue}
    const key=String(item.id||url);
    if(seen.has(key))continue;seen.add(key);
    const venue=clean(item.venue?.venue||'');
    const desc=clean(String(item.description||'').replace(/<[^>]*>/g,' ')).slice(0,700);
    const excerpt=clean(String(item.excerpt||'').replace(/<[^>]*>/g,' '));
    const cats=[...(item.categories||[]),...(item.tags||[])].map(c=>c.name||'').join(' ');
    const start=String(item.start_date||'').slice(11,16);
    const end=String(item.end_date||'').slice(11,16);
    const candidate={title,url,source:source.name,
     description:(excerpt||desc).slice(0,300),categories:cats,venue,address:clean(item.venue?.address||''),
     city:source.city,county:source.county,state:source.state,
     time:item.all_day?'':start,endTime:item.all_day?'':end,
     lat:null,lng:null,dates:[iso],needsDetail:false,dateEvidence:'Georgetown Events Calendar API'};
    // Venue coordinates in this API can be a generic Georgetown centroid;
    // retain the confirmed neighborhood rather than use potentially false pins.
    if(!outdoor(candidate)){notOutdoor++;continue}
    results.push(candidate);
   }
   if(!events.length||page>=Number(payload.total_pages||1))break;
  }
  report.candidates=results.length;
  report.detail=pages+' API pages · '+screened+' events screened · '+notOutdoor+' not confirmed outdoor · '+invalid+' invalid/outside range';
  return results;
 }catch(err){
  // Keep results already retrieved if a subsequent API page fails.
  report.ok=results.length>0;
  report.error=err.message;
  report.candidates=results.length;
  report.detail=pages+' pages completed · '+screened+' events screened · '+notOutdoor+' not confirmed outdoor';
  return results;
 }
}

async function loadHSEMA(){
 const source='DC HSEMA';
 const collected=new Map();let scanned=0,missingDate=0,outsideRange=0,notOutdoor=0,duplicate=0,detailFetched=0,detailFailed=0;
 const samples=[];
 function getDate(text){
  const info=dateInfo(text||'');return info.start||'';
 }
 function structuredEvent(doc){
  const found=[];
  function walk(v){
   if(!v||typeof v!=='object')return;
   if(Array.isArray(v)){v.forEach(walk);return}
   const types=[].concat(v['@type']||[]).map(x=>String(x).toLowerCase());
   if(types.some(t=>t==='event'||t.endsWith('/event')))found.push(v);
   Object.values(v).forEach(x=>{if(typeof x==='object')walk(x)});
  }
  doc.querySelectorAll('script[type="application/ld+json"]').forEach(el=>{try{walk(JSON.parse(el.textContent))}catch{}});
  return found[0]||null;
 }
 try{
  const links=new Map();
  for(const page of [0,1]){
   const html=await fetchText('https://hsema.dc.gov/events?page='+page,12000);
   const doc=docFrom(html);
   for(const a of doc.querySelectorAll('a[href]')){
    const href=a.getAttribute('href')||'';
    if(!/\/event\//i.test(href)||clean(a.textContent).length<=4)continue;
    scanned++;
    const url=new URL(href,'https://hsema.dc.gov').href;
    if(links.has(url)){duplicate++;continue}
    let node=a,listingDate='';
    for(let depth=0;depth<5&&node&&!listingDate;depth++,node=node.parentElement){
     const t=clean(node.textContent).slice(0,850);
     listingDate=getDate(t);
    }
    links.set(url,{url,title:clean(a.textContent),listingDate});
   }
  }
  const items=[...links.values()];let index=0;
  async function process(){
   while(index<items.length){
    const item=items[index++];
    let date=item.listingDate,title=item.title,time='',endTime='',venue='',address='',description='';
    try{
     const html=await fetchText(item.url,10000);detailFetched++;
     const doc=docFrom(html),body=clean(doc.body?.textContent||'');
     const event=structuredEvent(doc);
     if(event){
      date=parseDate(event.startDate||'')||date;
      title=clean(event.name||title);
      description=clean(event.description||'');
      const loc=event.location||{};
      venue=clean(loc.name||'');
      const adr=loc.address||{};
      address=clean(typeof adr==='string'?adr:[adr.streetAddress,adr.addressLocality,adr.addressRegion].filter(Boolean).join(', '));
      time=parseTime(event.startDate||'');
      endTime=parseTime(event.endDate||'');
     }
     // HSEMA Drupal pages often render dates as 'Friday, October 23, 2026'.
     if(!date){
      const dateNode=doc.querySelector('time[datetime], [property="schema:startDate"], [itemprop="startDate"], .field--name-field-event-date, .field-name-field-event-date, .date-display-single, .date-display-start');
      date=getDate(dateNode?.getAttribute('datetime')||dateNode?.getAttribute('content')||dateNode?.textContent||'')||getDate(body);
     }
     if(!time){
      const match=body.match(/\b(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)\w*,?\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\w*\s+\d{1,2},?\s+20\d{2}[^\n]{0,55}?\b(\d{1,2}:\d{2}\s*(?:am|pm))(?:\s*[-–]\s*(\d{1,2}:\d{2}\s*(?:am|pm)))?/i);
      if(match){time=parseTime(match[1]);endTime=parseTime(match[2]||'')}
     }
     if(!venue){const loc=body.match(/\bLocation\s*:\s*(.{5,180}?)(?=\s+Details\s*:|\s+Contact\s*:|$)/i);if(loc)venue=clean(loc[1]).slice(0,130)}
    }catch(e){detailFailed++}
    if(!date){missingDate++;if(samples.length<6)samples.push('No recognized date: '+title.slice(0,65));continue}
    if(!days.includes(date)){outsideRange++;if(samples.length<6)samples.push('Outside 7 days ('+date+'): '+title.slice(0,55));continue}
    // HSEMA publishes civic street events whose names may not contain generic
    // outdoor keywords. Recognize only these well-established named events;
    // do not relax the global outdoor filter for unrelated/indoor listings.
    const knownOutdoorStreetEvent=/\b(?:17th\s+street\s+(?:annual\s+)?high\s+heel\s+race|high\s+heel\s+race|hilloween)\b/i.test(title);
    const outdoorCandidate={title,description,venue,address,categories:''};
    const confirmedOutdoor=outdoor(outdoorCandidate)||(
      knownOutdoorStreetEvent &&
      !INDOOR_VENUE.test([venue,address].filter(Boolean).join(' ')) &&
      !INDOOR.test(title)
    );
    if(!confirmedOutdoor){notOutdoor++;if(samples.length<6)samples.push('Not recognized as outdoor: '+title.slice(0,65));continue}
    collected.set(item.url,{
     id:'hsema|'+item.url+'|'+date,title,source,url:item.url,date,time,endTime,
     venue,address,city:'Washington',state:'DC',county:'District of Columbia',
     description,categories:'',confidence:'HSEMA event page',category:category({title,categories:''})
    });
   }
  }
  await Promise.all([process(),process(),process()]);
  const entries=[...collected.values()];
  state.reports.push({source,ok:true,count:entries.length,candidates:entries.length,
   detail:scanned+' calendar links scanned · '+links.size+' unique pages · '+detailFetched+' detail pages fetched · '+detailFailed+' detail fetch failures · '+missingDate+' no date · '+outsideRange+' outside 7 days · '+notOutdoor+' not recognized as outdoor · '+duplicate+' duplicates'+(samples.length?' | Examples: '+samples.join(' / '):'')});
  return entries;
 }catch(err){state.reports.push({source,ok:false,error:err.message});return [...collected.values()]}
}

/* Ticketmaster Discovery v2: direct CORS fetch, conservative outdoor-only
 * selection. No API request is made to FindLocal. */
const TICKETMASTER_KEY='QQu8BPg6u7k1ixc3IkAM1dxE7aHLIEY4';
const TM_OUTDOOR_VENUE=/\b(?:nationals park|audi field|northwest stadium|commanders field|fedexfield|segra field|jiffy lube live|merriweather post pavilion|wolf trap|filene center|the barns at wolf trap|pier six pavilion|frederick fairgrounds|maryland state fairgrounds|loudoun county fairgrounds|bull run regional park|the anthem outdoors|the wharf amphitheater)\b/i;
const TM_INDOOR_VENUE=/\b(?:capital one arena|eaglebank arena|entertainment and sports arena|xfinity center|the anthem|the fillmore|9:30 club|the birchmere|the lincoln theatre|the warner theatre|the kennedy center|the lyric|the hamilton|strathmore|theatre|theater|hall|arena|casino|music center|the soundry|union stage)\b/i;
async function loadTicketmaster(){
 const source='Ticketmaster';let scanned=0,accepted=0;
 try{
  const start=new Date(days[0]+'T00:00:00-04:00');
  const end=new Date(days[days.length-1]+'T23:59:59-04:00');
  const url=new URL('https://app.ticketmaster.com/discovery/v2/events.json');
  url.searchParams.set('apikey',TICKETMASTER_KEY);
  url.searchParams.set('latlong','38.9072,-77.0369');
  url.searchParams.set('radius','65');
  url.searchParams.set('unit','miles');
  url.searchParams.set('startDateTime',start.toISOString().replace(/\.\d{3}Z$/,'Z'));
  url.searchParams.set('endDateTime',end.toISOString().replace(/\.\d{3}Z$/,'Z'));
  url.searchParams.set('size','200');
  url.searchParams.set('sort','date,asc');
  url.searchParams.set('countryCode','US');
  const response=await fetch(url.toString(),{credentials:'omit'});
  if(!response.ok)throw Error('HTTP '+response.status);
  const data=await response.json();
  const items=data?._embedded?.events||[];
  const events=[];
  for(const item of items){
   scanned++;
   const v=item._embedded?.venues?.[0]||{};
   const venue=clean(v.name||'');
   const title=clean(item.name||'');
   const st=(v.state?.stateCode||'').toUpperCase();
   const city=clean(v.city?.name||'');
   const county=countyFor(city,st);
   if(!GEOGRAPHY[st]?.includes(county))continue;
   const date=item.dates?.start?.localDate;
   if(!date||!days.includes(date))continue;
   // Ticketmaster has no dependable universal outdoor flag. Known outdoor
   // venues or unmistakably outdoor event titles only; reject indoor venues.
   const isKnown=TM_OUTDOOR_VENUE.test(venue);
   const isClearlyOutdoor=/\b(?:outdoor|open.air|festival|parade|marathon|5k|10k|fun run|bike ride|street fair|block party)\b/i.test(title);
   if(TM_INDOOR_VENUE.test(venue)&&!isKnown)continue;
   if(!isKnown&&!isClearlyOutdoor)continue;
   const time=item.dates?.start?.timeTBA||item.dates?.start?.noSpecificTime?'':parseTime(item.dates?.start?.localTime||'');
   const address=[v.address?.line1,city,st].filter(Boolean).join(', ');
   const lat=Number(v.location?.latitude),lng=Number(v.location?.longitude);
   events.push({id:'ticketmaster|'+item.id+'|'+date,
    title,source,url:item.url||'https://www.ticketmaster.com/',date,
    time,endTime:'',venue,address,city,state:st,county,
    lat:Number.isFinite(lat)?lat:null,lng:Number.isFinite(lng)?lng:null,
    description:clean(item.info||item.pleaseNote||''),categories:clean(item.classifications?.[0]?.segment?.name||''),
    confidence:'Ticketmaster schedule',category:category({title,categories:item.classifications?.[0]?.segment?.name||''})
   });
  }
  accepted=events.length;
  state.reports.push({source,ok:true,count:accepted,candidates:accepted,detail:scanned+' results screened'});
  return events;
 }catch(err){state.reports.push({source,ok:false,error:err.message});return []}
}

// Decode character references supplied by third-party calendars.
// Assign only to text fields; never decode URLs or insert source HTML.
function decodeEventText(value){
 const box=document.createElement('textarea');
 let text=String(value??'');
 for(let i=0;i<3;i++){
  box.innerHTML=text;
  const decoded=box.value;
  if(decoded===text)break;
  text=decoded;
 }
 return text;
}
function dedupe(events){
 const seen=new Map(),prepared=[];
 for(const e of events){
  for(const field of ['title','venue','address','description','categories']){
   if(typeof e[field]==='string')e[field]=decodeEventText(e[field]);
  }
  e.date=parseDate(e.date);if(days.includes(e.date))prepared.push(e);
 }
 const baseKey=e=>e.date+'|'+norm(e.title).replace(/\b20\d\d\b/g,'').replace(/[^a-z0-9]/g,'')+'|'+norm(e.county||e.city);
 const established=new Set(prepared.filter(e=>!e.occurrenceTime).map(baseKey));
 for(const e of prepared){
  const base=baseKey(e);
  if(e.occurrenceTime&&established.has(base))continue;
  const key=base+(e.occurrenceTime?'|'+e.occurrenceTime+'|'+norm(e.venue):'');
  if(!seen.has(key))seen.set(key,e);
 }
 return [...seen.values()].sort((a,b)=>a.date.localeCompare(b.date)||
  (a.time||'99:99').localeCompare(b.time||'99:99')||a.title.localeCompare(b.title));
}

/* Filter controls */

function options(select,values,label,current){
 select.replaceChildren();
 const all=document.createElement('option');
 all.value='';all.textContent=label;

function matches(e){
 if(state.day==='weekend'){
  // The Friday/Saturday/Sunday in the current seven-day window.
  // On Saturday or Sunday, show the remaining current weekend days;
  // on weekdays, show the next upcoming weekend.
  if(!weekendDays.has(e.date))return false;
 }else if(e.date!==days[Number(state.day)])return false;
 if(state.region&&e.state!==state.region)return false;
 if(state.county&&e.county!==state.county)return false;
 if(state.city&&e.city!==state.city)return false;
 if(state.type&&e.category!==state.type)return false;
 if(state.search&&![
  e.title,e.venue,e.address,e.city,
  e.county,e.description
 ].join(' ').toLowerCase().includes(state.search))

 return true;
}

function el(tag,cls,text){

function link(text,url){

function location(e){

// Select the top event only when a NEW column reaches about 40%
// of a tile width from the left edge. Update selection in place: rebuilding cards during
// scrolling would interrupt momentum and cause delayed/jumpy selection.
let scrollSelectionFrame=0;
function updateScrollSelection(){
 scrollSelectionFrame=0;
 const visible=state.events.filter(matches);
 const nodes=[...cards.querySelectorAll('.cwe-card')];
 if(!nodes.length)return;
 const desktop=!window.matchMedia('(max-width:620px)').matches;
 const stride=desktop?3:1;
 const edge=desktop?cards.getBoundingClientRect().top:cards.getBoundingClientRect().left;
 const size=desktop?nodes[0].getBoundingClientRect().height:nodes[0].getBoundingClientRect().width;
 const threshold=edge+size*0.4;
 let nearest=0;
 for(let i=0;i<nodes.length;i+=stride){
  const pos=desktop?nodes[i].getBoundingClientRect().top:nodes[i].getBoundingClientRect().left;
  if(pos<=threshold)nearest=i;
  else break;
 }
 const group=Math.floor(nearest/stride);
 if(group===state.scrollColumn)return;
 state.scrollColumn=group;
 const chosen=visible[nearest];
 if(!chosen||chosen.id===state.selected)return;
 state.selected=chosen.id;
 state.userSelected=true;
 nodes.forEach((node,i)=>node.classList.toggle('selected',i===nearest));
 detail.hidden=true;detail.replaceChildren();publishSelection(chosen);
}
window.matchMedia('(max-width:620px)').addEventListener('change',()=>{
 cards.scrollLeft=0;cards.scrollTop=0;state.scrollColumn=0;render();
});
cards.addEventListener('scroll',()=>{
 if(scrollSelectionFrame)return;
 scrollSelectionFrame=requestAnimationFrame(updateScrollSelection);
},{passive:true});
function moveEventColumn(direction){
 const nodes=[...cards.querySelectorAll('.cwe-card')];
 if(!nodes.length)return;
 const desktop=!window.matchMedia('(max-width:620px)').matches;
 const stride=desktop?3:1;
 const first=desktop?nodes[0].offsetTop:nodes[0].offsetLeft;
 const positions=[];
 for(let i=0;i<nodes.length;i+=stride){
  positions.push((desktop?nodes[i].offsetTop:nodes[i].offsetLeft)-first);
 }
 const current=desktop?cards.scrollTop:cards.scrollLeft;
 const tolerance=3;
 let target=direction>0?positions.find(x=>x>current+tolerance):[...positions].reverse().find(x=>x<current-tolerance);
 if(target===undefined)target=direction>0?positions[positions.length-1]:0;
 cards.scrollTo(desktop?{top:target,behavior:'smooth'}:{left:target,behavior:'smooth'});
}

 * Keep this pool separate so slow legacy feeds cannot delay these records. */
/* Round 2: publisher endpoints verified from Chromium with normal CORS.
 * Calendars are queried live; no stored event lists or proxy fallbacks. */
const ROUND2_SOURCES=[
 {name:'NPS Rock Creek Park',round2:'nps',parkCode:'rocr,cwdw',city:'Washington',county:'District of Columbia',state:'DC'},
 {name:'NPS National Mall',round2:'nps',parkCode:'nama',city:'Washington',county:'District of Columbia',state:'DC'},
 {name:'M-NCPPC Prince George’s Parks',round2:'tribe',endpoint:'https://www.pgparks.com/wp-json/tribe/events/v1/events',city:'',county:'Prince George’s County',state:'MD'},
 {name:'National Arboretum (FONA)',round2:'fona',endpoint:'https://www.fona.org/wp-json/wp/v2/pages?slug=events_programs&_fields=id,link,title,content',city:'Washington',county:'District of Columbia',state:'DC'},

function round2Text(html){
 const doc=docFrom(html||'');doc.querySelectorAll('script,style').forEach(n=>n.remove());
 return decodeEventText(textOf(doc.body));
}
function round2OutdoorEvidence(description,activityLocation=''){
 const d=clean(description),location=clean(activityLocation);
 // Neither a category, a title nor an outdoor-capable address qualifies.
 if(/\b(?:indoor\s*\/\s*outdoor|mixed indoor|indoors? only|not outdoors?|inside (?:the )?(?:house|museum|mill|building))\b/i.test(d))return '';
 const conditionalFallback=/\b(?:if|in case of|inclement weather)\b[^.!?]{0,140}\b(?:indoors|inside)\b/i.test(d);
 if(/\bindoors?\b|\binside (?:a |the )?(?:gym|classroom)\b/i.test(d)&&!conditionalFallback)return '';
 if(/\b(?:event|program|activity) (?:is now|has been) (?:moved|relocated) (?:indoors|inside)\b/i.test(d))return '';
 if(/\b(?:site[ -]wide|screening|movie|crafts?)\b/i.test(d)&&/\b(?:house tours?|exhibit|haunted house|outdoor discovery|also invited)\b/i.test(d))return '';
 const outdoor=d.match(/\b(?:outdoor (?:mobile )?(?:fitness|zumba|class|adventure|concert|movie|walk|workout|mindfulness)|(?:spend time|program (?:takes place|is held)|join us)[^.!?]{0,70}\b(?:outdoors|outside)|community campfire[^.!?]{0,100}\boutdoors)\b/i);
 if(outdoor)return outdoor[0];
 // Route/terrain in the description establishes where the activity occurs.
 if(/\b(?:walk(?:ing)?|hike|hiking|bike|ride|run)\b/i.test(d)&&/\b(?:trail|woods|woodlands|forests?|cemetery|sidewalks?|neighborhood|creek|river|monuments|memorials|fall foliage)\b/i.test(d))return 'Source describes the activity route or outdoor terrain';
 if(/\bfollow a scenic trail\b/i.test(d))return 'Exercises take place along the scenic trail';
 if(/\b(?:8k|5k|2k)\b[^.!?]{0,140}\b(?:race|run|walk)\b|\brace\b[^.!?]{0,100}\b(?:8k|5k|2k)\b/i.test(d))return 'Source describes a distance race/run; indoor programs are screened separately';
 if(/\b(?:market|vendors|growers)\b/i.test(d)&&/\b(?:explore the fields|grown on.site|on the (?:center |central )?plaza|on the street)\b/i.test(d))return 'Market activity is explicitly located in fields, a plaza or a street';
 if(/\bguided (?:hike|mindfulness) under (?:the light of )?the full moon\b/i.test(d))return 'Guided activity under the full moon';
 if(/\bjoin us in the yard\b/i.test(location))return 'Publisher explicitly places this activity in the yard';
 if(/\bjoin us in [^.!?]{0,60}gardens\b/i.test(d)&&/\bbring a lawn chair\b/i.test(d))return 'Garden program asks participants to bring a lawn chair';

}
function round2Weather(candidate){
 const sentences=candidate.description.match(/[^.!?]*(?:weather|rain|storm|snow|heat)[^.!?]*[.!?]?/gi)||[];
 const note=sentences.find(s=>/cancel|indoors|inside|postpone|reschedul|rain or shine/i.test(s));
 if(note){
  candidate.outdoorNote=clean(note);
  candidate.outdoorCardNote=/indoors|inside/i.test(note)?'Outdoors; indoor weather fallback':'Weather contingency; see details';

 return candidate;
}
function round2Candidate(source,fields,report){
 const c=verifiedBase(source,fields);
 c.title=decodeEventText(clean(c.title));c.description=clean(c.description);
 c.url=safeURL(c.url);
 if(!c.title||!c.url||!c.time||!c.endTime||!c.dates?.length||!c.venue){report.invalid++;return null}
 if(!c.dates.every(d=>days.includes(d))){report.outside++;return null}
 const evidence=round2OutdoorEvidence(c.description,c.activityLocation||'');
 if(!evidence){report.rejectedOutdoor++;return null}
 c.outdoorEvidence=evidence;c.outdoorEvidenceURL=c.url;
 // Explicit sessions may share a title/date but have different start times.
 // The global deduper still prefers an established-source listing on overlap.
 c.occurrenceTime=c.time;c.round2=true;
 report.outdoor++;
 return round2Weather(c);
}
function parseNPSRound2(payload,source,report){
 if(!Array.isArray(payload.data)||payload.errors?.length)throw Error('Invalid NPS calendar response');
 const result=[];
 for(const item of payload.data){
  report.discovered++;
  const date=String(item.date||'');
  // expandRecurring supplies explicit dates. Do not expand recurrence rules,
  // use a series start, or copy every dates[] entry onto every record.
  if(!validISO(date)||!days.includes(date)){report.outside++;continue}
  const cancelled=String(item.cancelledDateList||'').match(/\d{4}-\d{2}-\d{2}/g)||[];
  if(cancelled.includes(date)){report.cancelled++;continue}
  if(!/^[A-Fa-f0-9-]{20,}$/.test(item.id||'')){report.invalid++;continue}
  const description=round2Text(item.description),venue=clean(item.location);
  if(!description||!venue){report.invalid++;continue}
  report.parsed++;
  for(const time of item.times||[]){
   if(time.sunriseStart||time.sunsetEnd){report.invalid++;continue}
   const duration=description.match(/\b(\d+)[ -]minute\b/i);
   const begin=parseTime(time.timeStart),finish=parseTime(time.timeEnd);
   const minutes=t=>Number(t.slice(0,2))*60+Number(t.slice(3));
   if(duration&&begin&&finish&&minutes(finish)-minutes(begin)!==Number(duration[1])){report.invalid++;continue}
   const lat=Number(item.latitude),lng=Number(item.longitude);
   const candidate=round2Candidate(source,{title:item.title,
    url:'https://www.nps.gov/planyourvisit/event-details.htm?id='+encodeURIComponent(item.id),
    venue,address:venue,activityLocation:venue,description,
    time:parseTime(time.timeStart),endTime:parseTime(time.timeEnd),dates:[date],
    lat:lat>38&&lat<40?lat:null,lng:lng>-78.5&&lng<-76?lng:null,
    dateEvidence:'NPS explicit occurrence and time slot'},report);
   if(candidate)result.push(candidate);
  }
 }
 return result;
}
function pgRound2Location(item,description){
 // PG's API often returns venue: []. Do not invent locations for those events.
 const at=decodeEventText(clean(item.title)).match(/\s@\s+(.+?)(?:\s*\([^)]*\))?$/);
 if(at&&/\bpark\b/i.test(at[1]))return {venue:at[1],city:'',address:''};
 const nature=description.match(/\b([A-Z][\w’'-]+(?:\s+[A-Z][\w’'-]+){0,4}\s+Nature Center) is located in ([^.]+?) in ([^,]+), MD\b/);
 if(nature)return {venue:nature[1]+' — '+nature[2],city:nature[3],address:''};
 const farm=description.match(/\bUrban Farm Incubator at ([A-Z][\w ]+Regional Park)\b/);
 const address=description.match(/\b(?:held at|located at)\s+(\d+\s+[^.!?]+?)(?:\s+For more|$)/i);
 if(farm)return {venue:'Urban Farm Incubator at '+farm[1],city:'',address:address?clean(address[1]):''};
 return null;
}
function parseTribeRound2(payload,source,report){
 if(!Array.isArray(payload.events))throw Error('Invalid Events Calendar response');
 const result=[];
 for(const item of payload.events){
  report.discovered++;
  const date=String(item.start_date||'').slice(0,10);
  if(!validISO(date)||!days.includes(date)){report.outside++;continue}
  if(item.is_virtual||item.hide_from_listings||/\b(?:cancell?ed|postponed|sold out)\b/i.test(item.title)){report.cancelled++;continue}
  const description=round2Text(item.description);
  const rawVenue=Array.isArray(item.venue)?item.venue[0]:item.venue;
  let place=rawVenue?.venue?{venue:decodeEventText(rawVenue.venue),address:clean(rawVenue.address),city:clean(rawVenue.city)||source.city}:null;
  if(!place&&source.county==='Prince George’s County')place=pgRound2Location(item,description);
  if(!place){report.missingLocation++;continue}
  // A multi-day indoor/outdoor horse show is not a scheduled outdoor segment.
  if(String(item.end_date||'').slice(0,10)!==date){report.invalid++;continue}
  report.parsed++;
  const candidate=round2Candidate(source,{title:item.title,url:item.url,description,...place,
   time:item.all_day?'':parseTime(String(item.start_date).slice(11)),
   endTime:item.all_day?'':parseTime(String(item.end_date).slice(11)),dates:[date],
   dateEvidence:'Publisher Events Calendar explicit local schedule'},report);
  if(candidate)result.push(candidate);
 }
 return result;
}
function round2Epoch(raw){
 const value=Number(raw);if(!Number.isFinite(value)||value<1e9||value>5e9)return null;

 return {date:p.year+'-'+p.month+'-'+p.day,time:p.hour+':'+p.minute};
}
function parseFONARound2(payload,source,report){
 if(!Array.isArray(payload)||!payload[0]?.content?.rendered)throw Error('Invalid FONA page response');
 const doc=docFrom(payload[0].content.rendered),cards=[...doc.querySelectorAll('.eventon_list_event')],result=[];
 if(!cards.length)throw Error('FONA event cards missing');
 for(const card of cards){
  report.discovered++;

 report.candidates=unique.length;report.unique=unique.reduce((n,c)=>n+c.dates.length,0);
 report.ms=Math.round(performance.now()-began);
 report.detail=report.discovered+' discovered · '+report.parsed+' parsed · '+report.inRange+' in range · '+report.outdoor+' outdoor · '+report.unique+' unique · '+report.requests+' direct requests · '+report.ms+' ms';
 return unique;
}
async function loadVerifiedSources(sources=VERIFIED_SOURCES){
 let next=0;
 async function worker(){
  while(next<sources.length){
   const source=sources[next++],candidates=await loadVerifiedSource(source);
   const events=candidates.flatMap(c=>c.dates.map(d=>createEvent(c,d,c.dateEvidence)));
   state.events=dedupe([...state.events,...events]);
   for(const report of state.reports)if(VERIFIED_SOURCES.some(s=>s.name===report.source))report.count=state.events.filter(e=>e.source===report.source).length;
   geography();render();updateSourceDiagnostics();
  }
 }
 await Promise.all(Array.from({length:3},worker));
}

/* Load public tourism, HSEMA, and Ticketmaster sources independently. */

async function load(){
 const verifiedSources=loadVerifiedSources();
 const princeWilliam=loadPrinceWilliamImGoing().then(events=>{
  if(events.length){state.events=dedupe([...state.events,...events]);geography();render()}

 });
 const newSources=Promise.all([loadHSEMA(),loadTicketmaster()]).then(groups=>{
  state.events=dedupe([...state.events,...groups.flat()]);
  geography();render();
 });
 const tourismSources=[
  ...FEEDS.map(source=>()=>loadFeed(source)),
  ...NEIGHBORHOOD_CALENDARS.filter(source=>!ROUND2_SOURCES.some(s=>s.name===source.name)).map(source=>()=>loadNeighborhood(source)),
  ...BID_SOURCES.map(source=>()=>source.name==='Rosslyn BID'?loadRosslyn(source):source.name==='Downtown Silver Spring'?loadSilverSpring(source):source.name==='Georgetown BID'?loadGeorgetown(source):source.name==='Reston Town Center'?loadReston(source):loadBid(source)),
  ...CALENDAR_SOURCES.map(source=>()=>loadCalendar(source))
 ];

 // Start processing each source as soon as it finishes. Previously a single
 // slow calendar blocked ALL tourism sources via Promise.all().
 const seenCandidates=new Set();
 const workQueue=[];
 let active=0, sourcesRemaining=tourismSources.length;
 let pending=[], lastFlush=0, flushTimer=null;
 state.enriching=true;
 render();

 function flush(){
  if(flushTimer){clearTimeout(flushTimer);flushTimer=null;}
  if(pending.length){
   state.events=dedupe([...state.events,...pending]);
   pending=[];
   for(const report of state.reports){
    if(report.ok)report.count=state.events.filter(e=>e.source===report.source.replace(/ calendar$/,'')).length;
   }
   geography();render();
  }
  lastFlush=Date.now();
 }
 function scheduleFlush(immediate=false){
  if(immediate || Date.now()-lastFlush>600){flush();return;}
  if(!flushTimer)flushTimer=setTimeout(flush,350);
 }
 let doneResolve;
 const allDone=new Promise(resolve=>{doneResolve=resolve});
 function checkDone(){
  if(sourcesRemaining===0 && active===0 && workQueue.length===0)doneResolve();
 }
 function pump(){
  while(active<4 && workQueue.length){
   const candidate=workQueue.shift();active++;
   (async()=>{
    try{
     // Calendar cards and API records already have dates and do not
     // require another request. RSS candidates still get page verification.
     const events=candidate.needsDetail===false
      ?(candidate.dates||[]).map(parseDate).filter(iso=>days.includes(iso)).map(iso=>createEvent(candidate,iso,candidate.dateEvidence||'Calendar date'))
      :await processCandidate(candidate);
     if(events.length){pending.push(...events);scheduleFlush(pending.length>=5);}
    }catch(e){console.warn('Event candidate processing failed',e);}
    finally{active--;pump();checkDone();}
   })();
  }
  checkDone();
 }
 // Limit simultaneous source discovery requests. Detail verification has its
 // own four-worker queue above; neither queue waits for slow sources to render.
 const SOURCE_CONCURRENCY=5;
 let nextSource=0;
 const sourceTimings=[];
 async function sourceWorker(){
  while(nextSource<tourismSources.length){
   const index=nextSource++;
   const start=tourismSources[index];
   const began=performance.now();
   try{
    const candidates=await start();
    for(const candidate of candidates||[]){
     const key=(candidate.url||'').replace(/\/$/,'').toLowerCase();
     if(!key||seenCandidates.has(key))continue;
     seenCandidates.add(key);
     workQueue.push(candidate);
    }
    workQueue.sort((a,b)=>Number((b.dates||[]).includes(today))-Number((a.dates||[]).includes(today)));
    pump();
   }catch(err){console.warn('Event source failed',err);}
   finally{
    sourceTimings[index]=Math.round(performance.now()-began);
    sourcesRemaining--;pump();checkDone();
   }
  }
 }
 const tasks=Array.from({length:Math.min(SOURCE_CONCURRENCY,tourismSources.length)},()=>sourceWorker());
 state.discoveryTimings=sourceTimings;
 await Promise.all(tasks);
 await allDone;
 await verifiedSources;
 flush();
 state.enriching=false;
 render();
 updateSourceDiagnostics();
}

load().catch(err=>{
 $('#cwe-status').textContent=
  'Unable to load events: '+err.message;
});

})();
</script>
