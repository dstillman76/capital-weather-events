  const seg=segments[i];

   const city=clean(m[1]);

   const city=segments[i-1];
   if(city&&!/\d/.test(city)&&city.length<55)return {city,state:st};
  }

}

 if(/\b(?:farmers?[’\']? market|open.air market|street market|city market|flea market|pumpkin patch|corn maze|hayride|orchard picking|guided hikes?|nature walks?|trail walks?|birdwatching walks?|walking tours?|mural tours?|street art tours?|ghost walks?|5k|10k|half.marathon|marathon|parades?|bike rides?|cycling tours?|kayak(?:ing)?|canoe(?:ing)?|paddleboard(?:ing)?|boat tours?|harbor cruises?|river cruises?|trail cleanups?|park cleanups?)\b/i.test(title))

function outdoor(e){

function category(e){

 if(/festival|fair|parade|block party/.test(s))return 'festival';
 if(/boat|kayak|sail|paddle/.test(s))return 'water';
 if(/5k|10k|run|race|marathon|yoga|fitness|cycling/.test(s))
  return 'fitness';
 if(/football|soccer|baseball|sports|battle of the bands/.test(s))return 'sports';
 if(/concert|music|outdoor movie/.test(s))return 'music';
 if(/nature|hike|park|trail|garden|ghost tour|walking tour|public art tour/.test(s))

}

/* Upcoming 7-day occurrences */

const WEEKDAYS={
 sunday:0,monday:1,tuesday:2,wednesday:3,
 thursday:4,friday:5,saturday:6
};

function recurrenceDays(text){
 const s=norm(text);
 if(/\b(?:every day|daily|seven days a week)\b/.test(s))
  return [0,1,2,3,4,5,6];

 const result=new Set();
 if(/\b(?:every weekend|weekends only)\b/.test(s)){
  result.add(0);result.add(6);
 }
 if(/\b(?:recurr|weekly|every|each|on)\b/.test(s)){
  for(const [name,num] of Object.entries(WEEKDAYS)){
   if(new RegExp('\\b'+name+'s?\\b','i').test(s))
    result.add(num);
  }
 }
 return [...result];
}

function occurrences(start,end,recurrence){
 if(!start)return [];
 const last=end||start;
 const recurringWeekdays=recurrenceDays(recurrence);
 const result=[];
 // Iterate actual ISO calendar dates, never weekday numbers.
 for(const iso of days){
  if(iso<start||iso>last)continue;
  const weekday=new Date(iso+'T12:00:00Z').getUTCDay();
  if(start===last||(!recurringWeekdays.length&&!/\b(?:weekly|every (?:mon|tues|wednes|thurs|fri|satur|sun)day)\b/i.test(recurrence||''))||recurringWeekdays.includes(weekday))
   result.push(iso);
 }
 return result;
}

function dateInfo(text){
 const s=clean(text);
 const iso=[...s.matchAll(
  /\b(?:20\d\d-\d{1,2}-\d{1,2}|\d{1,2}\/\d{1,2}\/20\d\d)\b/g
 )].map(x=>parseDate(x[0])).filter(Boolean);

 const months=[...s.matchAll(
  /\b(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\s+\d{1,2},?\s+20\d\d/gi
 )].map(x=>parseDate(x[0])).filter(Boolean);

 const dates=[...new Set([...iso,...months])];
 if(!dates.length)return {start:'',end:''};
 dates.sort();
 return {start:dates[0],end:dates[1]||dates[0]};
}

/* Network and HTML helpers */

/* v20 request gate. Every proxied or direct request made through fetchText,
 * fetchDirectText or fetchSmart waits for a slot: at most NET_MAX requests in
 * flight overall and NET_PER_HOST per publisher, so concurrent source pools
 * cannot pile onto one website. A request's timeout starts only once it has
 * a slot, and the body is read inside the slot and the timer. */
const NET_MAX=12,NET_PER_HOST=4;
const net={active:0,hosts:new Map(),waiting:[],requests:0,proxy:0,direct:0,backup:0,timeouts:0,errors:0,peak:0};
function targetHost(u){
 let s=String(u||'');
 if(s.startsWith(PROXY))s=s.slice(PROXY.length);
 else if(s.startsWith(BACKUP_PROXY))try{s=decodeURIComponent(s.slice(BACKUP_PROXY.length))}catch{}
 try{return new URL(s).hostname.replace(/^www\./,'')}catch{return ''}
}
function netPump(){
 for(let i=0;i<net.waiting.length;i++){
  const w=net.waiting[i],n=net.hosts.get(w.host)||0;
  if(net.active>=NET_MAX)return;
  if(n>=NET_PER_HOST)continue;
  net.waiting.splice(i--,1);net.active++;net.peak=Math.max(net.peak,net.active);
  net.hosts.set(w.host,n+1);w.resolve();
 }
}
function netAcquire(host){return new Promise(resolve=>{net.waiting.push({host,resolve});netPump()})}
function netRelease(host){net.active--;net.hosts.set(host,Math.max(0,(net.hosts.get(host)||1)-1));netPump()}
async function netText(url,timeout=10000,opts={}){
 const host=targetHost(url);
 await netAcquire(host);
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),timeout);
 net.requests++;
 if(url.startsWith(PROXY))net.proxy++;else if(url.startsWith(BACKUP_PROXY))net.backup++;else net.direct++;
 try{
  const r=await fetch(url,{credentials:'omit',...opts,signal:controller.signal});
  const text=await r.text();
  return {status:r.status,ok:r.ok,text,retryAfter:r.headers.get('retry-after')||''};
 }catch(err){
  // Keep the AbortError name: established loaders test error.name for timeouts.
  if(controller.signal.aborted){net.timeouts++;const t=Error('Timed out after '+Math.round(timeout/100)/10+' s');t.name='AbortError';throw t}
  net.errors++;throw err;
 }finally{clearTimeout(timer);netRelease(host)}
}
async function fetchText(url,timeout=10000){
 if(COLLECT_MODE){const d=await netText(url,timeout);if(!d.ok)throw Error('HTTP '+d.status+(d.status===401||d.status===403?' (publisher refused)':''));if(!d.text.trim())throw Error('Empty response');return d.text}
 let r;
 try{r=await netText(PROXY+url,timeout)}catch(err){r={error:err}}
 // v21: the proxy answers 429 in short bursts when many sources start at once
 // (12 of ~500 requests in testing). Wait as told (2–5 s) and ask once more
 // before falling back to the slow backup proxy.
 // A 502 "upstream_unreachable" is usually a passing hiccup (DowntownDC failed
 // once this way and loaded fine seconds later), so it also gets one retry.
 const transient502=r.status===502&&/upstream_unreachable/.test(r.text||'');
 if(r.status===429||transient502){
  const wait=transient502?1500:Math.min(5000,Math.max(2000,(parseFloat(r.retryAfter)||0)*1000))+Math.random()*1000;
  await new Promise(res=>setTimeout(res,wait));
  try{r=await netText(PROXY+url,timeout)}catch(err){r={error:err}}
 }
 if(r.ok&&r.text.trim())return r.text;
 if(r.ok)throw Error('Empty response');
 // A publisher 401/403 is an access decision; never route around it.
 if(r.status===401||r.status===403)throw Error('HTTP '+r.status+' (publisher refused)');
 if(r.status===404||r.status===410)throw Error('HTTP '+r.status);
 if(r.status===502&&/unsupported_response|upstream_unreachable/.test(r.text||''))
  throw Error('HTTP 502 (proxy could not relay this publisher; often a cross-site redirect)');
 // The backup proxy answered 1 of 13 requests in testing, so it is used only
 // for proxy overload or network errors, never after a timeout, and briefly.
 if(r.status===429||r.status>=500||(r.error&&!/^Timed out/.test(r.error.message))){
  try{
   const b=await netText(BACKUP_PROXY+encodeURIComponent(url),Math.min(timeout,6000));
   if(b.ok&&b.text.trim())return b.text;
   throw Error('HTTP '+b.status);
  }catch(err){throw Error((r.error?r.error.message:'HTTP '+r.status)+'; backup proxy: '+err.message)}
 }
 throw r.error||Error('HTTP '+r.status);
}
/* Direct first for hosts that send CORS headers; after the first CORS or
 * network failure for a host, use the proxy only, so publishers are not hit
 * twice per page. */
const directBlocked=new Set();
async function fetchSmart(url,timeout=9000){
 const host=targetHost(url);
 if(!directBlocked.has(host)){
  try{return await fetchDirectText(url,Math.min(timeout,4000))}catch(err){
   const m=String(err.message||'');
   if(/^HTTP (?:401|403)/.test(m))throw Error(m+' (publisher refused)');
   if(/^HTTP (?:404|410)/.test(m))throw err;
   directBlocked.add(host);
  }
 }
 return fetchText(url,timeout);
}

function docFrom(html){
 return new DOMParser().parseFromString(html,'text/html');
}
function textOf(node){
 return clean(node?.textContent||'');
}
function labeledText(doc,label){
 const re=new RegExp('^'+label+'\\s*:\\s*','i');
 for(const el of doc.querySelectorAll(
  'p,li,td,dd,div,span'
 )){
  if(el.children.length>4)continue;
  const t=textOf(el);
  if(t.length>180)continue;
  if(re.test(t))return t.replace(re,'').trim();
 }
 return '';
}
function schemas(doc){
 const output=[];
 function visit(v){
  if(!v||typeof v!=='object')return;
  if(Array.isArray(v)){v.forEach(visit);return}
  output.push(v);
  if(v['@graph'])visit(v['@graph']);
  if(v.mainEntity)visit(v.mainEntity);
  if(v.itemListElement)visit(v.itemListElement);
 }
 for(const script of doc.querySelectorAll(
  'script[type="application/ld+json"]'
 )){
  try{visit(JSON.parse(script.textContent))}catch{}
 }
 return output.filter(x=>
  (Array.isArray(x['@type'])?x['@type']:[x['@type']])
   .some(t=>/Event$/i.test(String(t||'')))
 );
}
function schemaDateTime(x){
 if(!x)return {date:'',time:''};
 const raw=String(x);
 if(/Z$/.test(raw)||/[+-]\d\d:\d\d$/.test(raw)){
  const dt=new Date(raw);
  if(isNaN(dt))return {date:'',time:''};
  const parts=new Intl.DateTimeFormat('en-US',{
   timeZone:'America/New_York',
   year:'numeric',month:'2-digit',day:'2-digit',
   hour:'2-digit',minute:'2-digit',hourCycle:'h23'
  }).formatToParts(dt);
  const p=Object.fromEntries(
   parts.map(z=>[z.type,z.value])
  );
  return {
   date:p.year+'-'+p.month+'-'+p.day,
   time:p.hour+':'+p.minute
  };
 }
 return {
  date:parseDate(raw.slice(0,10)),
  time:parseTime(raw.split('T')[1]||'')
 };
}
function eventPageData(html){
 const doc=docFrom(html);
 const main=doc.querySelector(
  'main,article,.event-detail,.event-details'
 )||doc.body;
 const visible=textOf(main);
 const schema=schemas(doc)[0];
 const result={
  venue:'',address:'',city:'',state:'',
  time:'',endTime:'',start:'',end:'',
  recurrence:'',lat:null,lng:null
 };

 if(schema){
  const loc=Array.isArray(schema.location)?
   schema.location[0]:schema.location;
  const addr=loc?.address||{};
  result.venue=clean(loc?.name);
  if(typeof addr==='object'){
   result.address=clean(addr.streetAddress);
   result.city=clean(addr.addressLocality);
   result.state=stateCode(addr.addressRegion);
  }
  const a=schemaDateTime(schema.startDate);
  const b=schemaDateTime(schema.endDate);
  result.start=a.date;
  result.time=a.time;
  result.end=b.date;
  result.endTime=b.time;
  if(loc?.geo){
   result.lat=Number(loc.geo.latitude)||null;
   result.lng=Number(loc.geo.longitude)||null;
  }
  // Schema exporters write all-day or unscheduled listings as midnight to
  // 23:59. Those are not clock times; never show them as event hours.
  if(result.time==='00:00'&&(!result.endTime||result.endTime==='00:00'||/^23:5\d$/.test(result.endTime))){
   result.time='';result.endTime='';result.placeholderTime=true;
  }
 }

 // Some event platforms embed the authoritative schedule in inline
 // JavaScript instead of visible HTML or JSON-LD (e.g. Simpleview).
 // Only accept clearly named schedule variables, not arbitrary clock text.
 const scriptText=[...doc.querySelectorAll('script:not([src])')]
  .map(node=>node.textContent||'').join('\n');
 const scriptField=name=>{
  const escaped=name;
  const match=scriptText.match(new RegExp('\\b(?:var|let|const)\\s+'+escaped+'\\s*=\\s*\"([^\"]+)\"','i'));
  return match?match[1]:'';
 };
 const embeddedRange=timeRange(scriptField('time'));
 if(!result.time)result.time=embeddedRange.start;
 if(!result.endTime)result.endTime=embeddedRange.end;
 const embeddedStart=scriptField('startDate');
 const embeddedEnd=scriptField('endDate');
 if(embeddedStart){
  if(!result.time)result.time=parseTime(embeddedStart);
  if(!result.start)result.start=parseDate(embeddedStart);
 }
 if(embeddedEnd){
  if(!result.endTime)result.endTime=parseTime(embeddedEnd);
  if(!result.end)result.end=parseDate(embeddedEnd);
 }

 // Many organizers (including NPS) print the occurrence as
 // "Oct 25, 2026 at 2:00 PM" rather than a labeled Time field.
 // Restrict this match to the event's date to avoid unrelated clock times.
 const datedClock=visible.match(/\b((?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\s+\d{1,2},?\s+20\d{2})\s+(?:at|@)\s+(\d{1,2}(?::[0-5]\d)?\s*[ap]\.?m\.?)/i);
 if(datedClock){
  if(!result.start)result.start=parseDate(datedClock[1]);
  if(!result.time)result.time=parseTime(datedClock[2]);
 }
 // Some event pages label the time as a single clock time, not a range.
 const explicitClock=visible.match(/\b(?:Time|Start time|Begins at|Starts at)\s*:\s*(\d{1,2}(?::[0-5]\d)?\s*[ap]\.?m\.?)/i);
 if(explicitClock&&!result.time)result.time=parseTime(explicitClock[1]);
 // Event detail pages often put the time in a short labeled block,
 // separate from the date and address. Inspect both visible text and
 // individual text-bearing elements, rather than relying on RSS metadata.
 const timeBlocks=[...doc.querySelectorAll('p,li,div,span,dd,td')]
  .filter(el=>el.children.length<=3)
  .map(el=>textOf(el))
  .filter(t=>t.length<180&&/^Time\s*:/i.test(t));
 const t=timeBlocks[0]||labeledText(main,'Time');
 const range=timeRange(t||visible);
 if(!result.time)result.time=range.start;
 if(!result.endTime)result.endTime=range.end;
 // Simpleview pages sometimes separate the 'Time:' label and its value
 // into different elements. Search the full body for that explicit label,
 // not arbitrary clock times (which might describe unrelated activities).
 if(!result.time){
  // Fall back to text from the complete document: some tourism templates
  // render the labeled time outside <main> or split it across elements.
  const allText=textOf(doc.body);
  const labeled=allText.match(/\bTime\s*:\s*(\d{1,2}(?::[0-5]\d)?\s*[ap]\.?m\.?\s*(?:to|through|[-–—])\s*\d{1,2}(?::[0-5]\d)?\s*[ap]\.?m\.?)/i);
  if(labeled){const found=timeRange(labeled[1]);result.time=found.start;result.endTime=found.end;}
  if(!result.time){
   const one=allText.match(/\bTime\s*:\s*(\d{1,2}(?::[0-5]\d)?\s*[ap]\.?m\.?)/i);
   if(one)result.time=parseTime(one[1]);
  }
 }


 result.recurrence=labeledText(main,'Recurrence')||
  (visible.match(/Recurring\s+(?:weekly|daily)\s+on\s+[^.]{5,90}/i)||[])[0]||'';

 // National Park Service pages expose recurring schedules and a
 // "Next event" date; the next event is authoritative for the near term.
 const next=visible.match(/\bNext event\s*:\s*((?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\s+\d{1,2},?\s+20\d\d)/i);
 if(next)result.nextEvent=parseDate(next[1]);
 const weekly=visible.match(/\bEvery week on\s+([A-Za-z]+)\s+at\s+(\d{1,2}(?::\d\d)?\s*[ap]\.?m\.?)\s+from\s+([A-Za-z]+\s+\d{1,2},?\s+20\d\d)\s+to\s+([A-Za-z]+\s+\d{1,2},?\s+20\d\d)/i);
 if(weekly){
  result.recurrence='every '+weekly[1];
  result.start=parseDate(weekly[3])||result.start;
  result.end=parseDate(weekly[4])||result.end;
  result.time=parseTime(weekly[2])||result.time;
 }
 // Tourism event templates commonly expose the actual occurrence in a
 // <time datetime> or <meta itemprop=startDate> rather than body copy.
 // Limit this fallback to event-related nodes inside the main event content.
 if(!result.start){
  const dateNodes=[...main.querySelectorAll('time[datetime],[itemprop="startDate"][content],[class*="event-date"] time[datetime]')];
  for(const node of dateNodes){
   const raw=node.getAttribute('datetime')||node.getAttribute('content')||'';
   const parsed=schemaDateTime(raw);
   if(parsed.date){
    result.start=parsed.date;
    if(parsed.time&&!result.time)result.time=parsed.time;
    break;
   }
  }
 }
 const dates=labeledText(main,'Dates')||
  labeledText(main,'Date')||labeledText(main,'Event Date');
 if(dates){
  const parsed=dateInfo(dates);
  if(!result.start)result.start=parsed.start;
  if(!result.end)result.end=parsed.end;
 }

 const venue=labeledText(main,'Venue')||
  labeledText(main,'Location');
 if(!result.venue&&venue&&venue.length<90)
  result.venue=venue;

 // Use address text near the event, including ZIP.
 const addressMatch=visible.match(
  /(\d{1,5}\s+[A-Za-z0-9 .'-]{3,65}?\s+(?:Street|St\.?|Avenue|Ave\.?|Road|Rd\.?|Drive|Dr\.?|Boulevard|Blvd\.?|Lane|Ln\.?|Way|Place|Pl\.?))\s*,?\s*([A-Z][A-Za-z.' -]{1,40}?),\s*(MD|VA|DC)\s+\d{5}/i

  if(!result.address)result.address=clean(addressMatch[1]);
  if(!result.city)result.city=clean(addressMatch[2]);

 // The event venue is not necessarily the actual event city. When a
 // location explicitly identifies DC (e.g., "Georgetown area of DC"),
 // use Washington for the forecast even if the venue says Rock Creek Park.
 if(!result.state&&/(?:Georgetown|Washington|District of Columbia|\bD\.?C\.?)\s*(?:area of|,|in)?\s*(?:D\.?C\.?|District of Columbia)\b/i.test(visible.slice(0,5500))){
  result.city='Washington';result.state='DC';
 }
 if(!result.state&&/\b(?:Washington,?\s*D\.?C\.?|Georgetown\s+(?:area\s+of\s+)?D\.?C\.?)\b/i.test(visible.slice(0,5500))){
  result.city='Washington';result.state='DC';
 }
 if(!result.city){
  const parsed=parseAddress(visible.slice(0,3500));
  if(parsed){
   result.city=parsed.city;
   if(!result.state)result.state=parsed.state;
  }
 }
 return result;
}

/* RSS candidates: preserve entries for detail-page date checks. */

function parseRSS(xml,feed){
 const doc=new DOMParser().parseFromString(xml,'application/xml');
 if(doc.querySelector('parsererror'))throw Error('Invalid XML');
 const items=[...doc.querySelectorAll('item')];
 if(!items.length)throw Error('No RSS items');
 const get=(el,name)=>clean(el.getElementsByTagName(name)[0]?.textContent);
 const candidates=[];
 let rejectedOutdoor=0,missingLinks=0,withRSSDates=0;
 for(const item of items){
  const title=get(item,'title');
  const url=safeURL(get(item,'link'));
  if(!title||!url){missingLinks++;continue}
  // WordPress and Simpleview RSS feeds often put richer event information
  // in content:encoded or custom namespace tags, not description.
  const raw=get(item,'description');
  const rich=[...item.children].filter(x=>
   /^(encoded|content|event_start_date|event_end_date|start_date|end_date|start|end|date)$/i.test(x.localName||'')
  ).map(x=>clean(x.textContent)).join(' ');
  const description=textOf(docFrom(raw+' '+rich).body);
  const categories=[...item.getElementsByTagName('category')]
   .map(x=>clean(x.textContent)).join(', ');
  const base={
   title,url,source:feed.name,description,categories,
   venue:'',address:'',city:feed.city||'',
   county:feed.county,state:feed.state,
   time:'',endTime:'',lat:null,lng:null
  };
  // Defer outdoor classification until the linked event page has been read.
  // RSS excerpts are frequently too short to establish where an activity occurs.
  const di=dateInfo(description);
  const times=timeRange(description);
  base.time=times.start;base.endTime=times.end;
  const dates=occurrences(di.start,di.end,description);
  const scheduleAmbiguous=di.start!==di.end&&!recurrenceDays(description).length&&!/\b(?:daily|every day)\b/i.test(description);
  if(scheduleAmbiguous)dates.length=0;
  if(dates.length)withRSSDates++;
  candidates.push({
   ...base,dates,scheduleAmbiguous,needsDetail:true,
   dateEvidence:di.start?'RSS description':''
  });
 }
 return {
  candidates,total:items.length,
  rejectedOutdoor,missingLinks,withRSSDates
 };
}

/* Calendar discovery: supplement RSS with dated, paginated event grids.
 * Calendar links are discovered from returned HTML; JavaScript-only grids
 * may be inaccessible to this browser-only prototype. */
function calendarURL(source,skip){
 const u=new URL(source.base);
 u.searchParams.set('view','grid');
 u.searchParams.set('sort','date');
 u.searchParams.set('filter_daterange[start]',firstDay);
 u.searchParams.set('filter_daterange[end]',lastDay);
 if(skip)u.searchParams.set('skip',String(skip));
 if(source.category)u.searchParams.set('filter_categories[0]',String(source.category));

/* Prince William County publishes dated event listings in HTML. Match the
 * dated listing containers rather than relying on individual text nodes. */
function princeWilliamEntries(html,source){

  title=clean(title);iso=parseDate(iso);
  if(!days.includes(iso)||title.length<5||title.length>170)return;
  const key=norm(title)+'|'+iso;
  if(seen.has(key))return;
  const c={title,url:url||base+'/events',source,
   description:clean(context).slice(0,1300),categories:'',
   venue,address,city:'',county:'Prince William County',state:'VA',
   time:parseTime(time),endTime:'',dates:[iso],
   needsDetail:!!url&&url!==base+'/events',
   dateEvidence:'Prince William County dated listing'};
  if(!outdoor(c))return;

 }
 // Handle event-card markup in multiple Drupal versions, including
 // date/title fields that are siblings rather than descendants.
 for(const block of doc.querySelectorAll(
  'article, .views-row, [class*="event-item"], [class*="event-card"], [class*="event-list"], [class*="calendar-event"], [data-event-id]'
  )){
  const txt=textOf(block).slice(0,2500);
  const iso=txt.match(dateRE)?.[0]||
   block.querySelector('time[datetime]')?.getAttribute('datetime')?.slice(0,10);
  if(!iso||!days.includes(iso))continue;
  const anchor=[...block.querySelectorAll('a[href]')].find(a=>{
   try{return linkRE.test(new URL(a.href,base).pathname)}catch{return false}
  });
  const title=clean(anchor?.textContent||
   block.querySelector('h2,h3,h4,[class*="title"]')?.textContent||'');
  let url='';
  try{if(anchor)url=new URL(anchor.getAttribute('href'),base).href}catch{}
  const time=txt.match(/\b\d{1,2}:\d\d\s*[AP]M\b/i)?.[0]||'';

 // parse the explicit date / title / time / address sequence.

  .split(/\n+/).map(x=>clean(x)).filter(Boolean);

  {name:'Backup CORS proxy',url:BACKUP_PROXY+encodeURIComponent(url),timeout:45000}

/* Candidate enrichment before final inclusion */

function createEvent(candidate,iso,confidence){

  ...candidate,
  id:candidate.source+'|'+candidate.url+'|'+iso+(candidate.occurrenceTime?'|'+candidate.occurrenceTime+'|'+norm(candidate.venue):''),
  date:parseDate(iso),confidence,
  category:category(candidate)
 };
 delete e.dates;
 delete e.needsDetail;
 return e;
}

function mergePage(candidate,page){
 if(page.venue&&!candidate.venue)candidate.venue=page.venue;
 if(page.address)candidate.address=page.address;
 if(page.city)candidate.city=page.city;
 if(page.state)candidate.state=page.state;
 if(page.time)candidate.time=page.time;
 if(page.endTime)candidate.endTime=page.endTime;
 // The listing may carry the same midnight-to-23:59 placeholder as the page.
 if(page.placeholderTime&&!page.time&&candidate.time==='00:00'){candidate.time='';candidate.endTime=''}
 if(page.lat)candidate.lat=page.lat;
 if(page.lng)candidate.lng=page.lng;
 applyAddress(candidate);

 let dates=candidate.dates||[];
 const confirmed=occurrences(
  page.start,page.end,page.recurrence
 );
 if(confirmed.length && !/^Publisher (?:calendar dated event card|specific dated calendar card)/.test(candidate.dateEvidence||''))dates=confirmed;
 else if(page.start&&page.end&&!/^Publisher (?:calendar dated event card|specific dated calendar card)/.test(candidate.dateEvidence||'')){
  // A dated event page can invalidate RSS-derived dates.
  dates=dates.filter(x=>x>=page.start&&x<=page.end);
 }
 else if(page.start&&!page.end&&!/^Publisher (?:calendar dated event card|specific dated calendar card)/.test(candidate.dateEvidence||'')){
  // Single-date page is authoritative.
  dates=days.includes(page.start)?[page.start]:[];
 }
 if(page.nextEvent){
  // Do not fabricate occurrences earlier than the organizer's next event.
  dates=dates.filter(x=>x>=page.nextEvent);
 }

  candidate.dateEvidence||'RSS schedule';
}

// Preserve representative rejected records so the source problem can be
// investigated from actual event names and dates, not aggregate counters.
const legacyRejectSamples={};
function sampleLegacyReject(c,reason,page){

 if(group.length>=12)return;
 group.push({reason,title:c.title||'',dates:(c.dates||[]).join(','),
  start:page?.start||'',end:page?.end||'',
  time:c.time||'',venue:c.venue||'',url:c.url||''});
}

async function processCandidate(candidate){
 let confidence=candidate.dateEvidence||'RSS schedule';
 let inspectedPage=null;
 try{
  state.attempted++;
  const html=await fetchText(candidate.url,9000);
  if(html.length>1800000)throw Error('Page too large');
  const page=eventPageData(html);
  inspectedPage=page;
  // Enrich sparse RSS summaries with event-page details before deciding whether
  // an activity is outdoors. Avoid sitewide navigation/footer text: use the
  // event-specific article or description element when available.
  const detailDoc=docFrom(html);
  const detailNode=detailDoc.querySelector('[itemprop="description"],.event-description,.eventDescription,.event-detail__description,.event-details__description,article .content,article .description');
  if(detailNode){
   const detailText=textOf(detailNode).slice(0,4000);
   if(detailText&&!candidate.description.includes(detailText.slice(0,100)))
    candidate.description=(candidate.description+' '+detailText).slice(0,5500);

  confidence=mergePage(candidate,page);
  if(candidate.dateEvidence==='Publisher-specific dated calendar card'&&candidate.dates?.length)confidence=candidate.dateEvidence;

  state.failed++;coverageStage(candidate.source,'detailAccessFailures');

 // start time. Never infer daily recurrence or manufacture a clock time.
 // The card already labels such listings "Time not confirmed".

  coverageStage(candidate.source,'missingSchedule');sampleLegacyReject(candidate,'missing schedule or date',inspectedPage);return [];
 }
 if(!candidate.time && inWindowDates.length!==1){
  coverageStage(candidate.source,'missingSchedule');sampleLegacyReject(candidate,'missing schedule or date',inspectedPage);return [];
 }

  .map(iso=>parseDate(iso)).filter(iso=>days.includes(iso))

 state.reports.push(report);

 try{

async function loadHSEMA(){
 if(COLLECT_MODE)return [];
 const source='DC HSEMA';
 const collected=new Map();let scanned=0,missingDate=0,outsideRange=0,notOutdoor=0,duplicate=0,detailFetched=0,detailFailed=0;
 const samples=[];
 function getDate(text){
  const info=dateInfo(text||'');return info.start||'';
 }
 function structuredEvent(doc){
  const found=[];
  function walk(v){
   if(!v||typeof v!=='object')return;
   if(Array.isArray(v)){v.forEach(walk);return}
   const types=[].concat(v['@type']||[]).map(x=>String(x).toLowerCase());
   if(types.some(t=>t==='event'||t.endsWith('/event')))found.push(v);
   Object.values(v).forEach(x=>{if(typeof x==='object')walk(x)});
  }
  doc.querySelectorAll('script[type="application/ld+json"]').forEach(el=>{try{walk(JSON.parse(el.textContent))}catch{}});
  return found[0]||null;
 }
 try{
  const links=new Map();
  for(const page of [0,1]){
   const html=await fetchText('https://hsema.dc.gov/events?page='+page,12000);
   const doc=docFrom(html);
   for(const a of doc.querySelectorAll('a[href]')){
    const href=a.getAttribute('href')||'';
    if(!/\/event\//i.test(href)||clean(a.textContent).length<=4)continue;
    scanned++;

    if(links.has(url)){duplicate++;continue}
    let node=a,listingDate='';
    for(let depth=0;depth<5&&node&&!listingDate;depth++,node=node.parentElement){
     const t=clean(node.textContent).slice(0,850);
     listingDate=getDate(t);
    }
    links.set(url,{url,title:clean(a.textContent),listingDate});
   }
  }
  const items=[...links.values()];let index=0;
  async function process(){
   while(index<items.length){
    const item=items[index++];
    let date=item.listingDate,title=item.title,time='',endTime='',venue='',address='',description='';
    try{
     const html=await fetchText(item.url,10000);detailFetched++;
     const doc=docFrom(html),body=clean(doc.body?.textContent||'');
     const event=structuredEvent(doc);
     if(event){
      date=parseDate(event.startDate||'')||date;
      title=clean(event.name||title);

     }
     // HSEMA Drupal pages often render dates as 'Friday, October 23, 2026'.
     if(!date){
      const dateNode=doc.querySelector('time[datetime], [property="schema:startDate"], [itemprop="startDate"], .field--name-field-event-date, .field-name-field-event-date, .date-display-single, .date-display-start');
      date=getDate(dateNode?.getAttribute('datetime')||dateNode?.getAttribute('content')||dateNode?.textContent||'')||getDate(body);
     }
     if(!time){
      const match=body.match(/\b(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)\w*,?\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\w*\s+\d{1,2},?\s+20\d{2}[^\n]{0,55}?\b(\d{1,2}:\d{2}\s*(?:am|pm))(?:\s*[-–]\s*(\d{1,2}:\d{2}\s*(?:am|pm)))?/i);

   const isKnown=TM_OUTDOOR_VENUE.test(venue);
   if(TM_INDOOR_VENUE.test(venue)&&!isKnown){coverageStage(source,'indoorOrMixed');continue}
   if(outdoorDenial({title,description:item.info||item.pleaseNote||''})||(!isKnown&&!outdoorEvidence({title,description:item.info||item.pleaseNote||'',venue}))) {coverageStage(source,'insufficientEvidence');continue}
   if(item.dates?.status?.code==='cancelled'||item.dates?.status?.code==='postponed'){coverageStage(source,'cancelled');continue}
   if(item.dates?.start?.dateTBD||item.dates?.start?.dateTBA||item.dates?.start?.timeTBA||item.dates?.start?.noSpecificTime){coverageStage(source,'missingSchedule');continue}
   const time=parseTime(item.dates?.start?.localTime||'');
   if(!time){coverageStage(source,'missingSchedule');continue}
   coverageStage(source,'outdoor');
   const address=[v.address?.line1,city,st].filter(Boolean).join(', ');
   const lat=Number(v.location?.latitude),lng=Number(v.location?.longitude);
   events.push({id:'ticketmaster|'+item.id+'|'+date,
    title,source,url:item.url||'https://www.ticketmaster.com/',date,
    time,endTime:'',venue,address,city,state:st,county,
    lat:Number.isFinite(lat)?lat:null,lng:Number.isFinite(lng)?lng:null,
    description:clean(item.info||item.pleaseNote||''),categories:clean(item.classifications?.[0]?.segment?.name||''),
    outdoorEvidence:isKnown?'Scheduled activity at a verified outdoor sports/performance venue':outdoorEvidence({title,description:item.info||item.pleaseNote||''}),outdoorEvidenceURL:item.url,
    confidence:'Ticketmaster schedule',category:category({title,categories:item.classifications?.[0]?.segment?.name||''})
   });
  }
  accepted=events.length;
  state.reports.push({source,ok:true,count:accepted,candidates:accepted,detail:scanned+' results screened'});
  return events;
 }catch(err){state.reports.push({source,ok:false,error:err.message});return []}
}

// Decode character references supplied by third-party calendars.
// Assign only to text fields; never decode URLs or insert source HTML.
function decodeEventText(value){
 const box=document.createElement('textarea');
 let text=String(value??'');
 for(let i=0;i<3;i++){
  box.innerHTML=text;
  const decoded=box.value;
  if(decoded===text)break;
  text=decoded;
 }
 return text;
}
function eventIdentityTitle(e){
 let title=norm(e.title).replace(/\b20\d\d\b/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
 if(/\bmarket\b/.test(title)||e.marketIdentity){
  const name=norm(e.marketIdentity||title).replace(/\b(?:freshfarm|farmers?|market|saturday|sunday|wednesday|thursday|sat|wed|sun)\b/g,'').replace(/[^a-z0-9]/g,'');
  if(name.length>4)return 'market:'+name;
 }
 return title.replace(/\b(?:free|event)\b/g,'').replace(/\s+/g,' ').trim();
}
function eventAliasKey(e){
 const text=norm(e.description||''),clock=e.time||'',area=norm(e.county||e.city);
 const route=text.match(/parade down (.+?) to (.+?park)\b/);
 if(route&&/costume.*parade|parade.*contest/i.test(e.title))return e.date+'|parade|'+route[1]+'|'+route[2]+'|'+area+'|'+clock;
 if(/trunk.or.treat/i.test(e.title)){
  const address=norm(e.address||'').replace(/\bdrive\b/g,'dr').replace(/\broad\b/g,'rd');
  const street=address.match(/\b\d{2,6}\s+[a-z0-9 ]+?\s(?:dr|rd|ave|avenue|st|street)\b/);
  if(street)return e.date+'|trunk-or-treat|'+street[0]+'|'+area+'|'+clock;
 }
 return '';
}
function conflictingEntity(e){
 if(e.source!=='Visit Montgomery'||!/festival/i.test(e.title)||!e.venue||!e.endTime)return '';
 const words=norm(e.title).replace(/\b(?:at|the|and|20\d\d)\b/g,'').replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean).sort().join('');
 return e.source+'|'+e.date+'|'+words+'|'+norm(e.venue)+'|'+e.endTime;
}
function dedupe(events){
 const prepared=[];
 for(const e of events){
  for(const field of ['title','venue','address','description','categories'])if(typeof e[field]==='string')e[field]=decodeEventText(e[field]);
  // Remove publisher platform attribution leaking into event copy.
  // Keep the event's original URL and source diagnostics unchanged.
  for(const field of ['title','description','venue'])if(typeof e[field]==='string'){
   e[field]=clean(e[field].replace(/\s*\((?:via\s+)?(?:imgoing|imgoingcalendar)(?:\.com)?\)\s*/gi,' '));
  }
  // Publisher feeds sometimes use inconsistent city capitalization.
  if(/^annapolis$/i.test(clean(e.city||'')))e.city='Annapolis';
  if(/^annapolis$/i.test(clean(e.venue||'')))e.venue='Annapolis';
  if(/^annapolis$/i.test(clean(e.address||'')))e.address='Annapolis';
  // FRESHFARM markets are excluded editorially, whichever source lists them.
  if(/freshfarm/i.test((e.title||'')+' '+(e.venue||'')))continue;
  e.date=parseDate(e.date);if(days.includes(e.date))prepared.push(e);
 }
 // v22: the same publisher page reached by two loaders (a tourism feed and the
 // daily collector) is one event; keep the more complete copy.
 const byLink=new Map(),linkRank=x=>(x.endTime?2:0)+(x.address?1:0)+(x.venue?1:0);
 for(const e of prepared){
  if(!e.url)continue;
  const k=String(e.url).replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,'').toLowerCase()+'|'+e.date+'|'+(e.time||'');
  const p=byLink.get(k);if(!p||linkRank(e)>linkRank(p))byLink.set(k,e);
 }
 for(let i=prepared.length-1;i>=0;i--){const e=prepared[i];if(!e.url)continue;
  const k=String(e.url).replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,'').toLowerCase()+'|'+e.date+'|'+(e.time||'');
  if(byLink.get(k)!==e)prepared.splice(i,1)}
 // v25: one game or concert at an open-air stadium is one event, however many
 // ticket products ("Premium Spaces: …", "Fan Appreciation: …") or calendars list it.
 const byStage=new Map();
 for(const e of prepared){
  if(!e.time||!e.venue||!TM_OUTDOOR_VENUE.test(e.venue))continue;
  const k=norm(e.venue)+'|'+e.date+'|'+e.time,p=byStage.get(k);
  const score=x=>(/^(?:premium|vip|parking|suite|club|fan appreciation)/i.test(x.title)?1000:0)+String(x.title).length;
  if(!p||score(e)<score(p))byStage.set(k,e);
 }
 for(let i=prepared.length-1;i>=0;i--){const e=prepared[i];if(!e.time||!e.venue||!TM_OUTDOOR_VENUE.test(e.venue))continue;
  if(byStage.get(norm(e.venue)+'|'+e.date+'|'+e.time)!==e)prepared.splice(i,1)}
 const conflicts=typeof state==='object'?(state.conflictedEntities||(state.conflictedEntities=new Set())):new Set();
 const aliases=new Map();
 for(const e of prepared){
  const key=conflictingEntity(e);if(!key)continue;
  const previous=aliases.get(key);
  if(previous&&previous.time!==e.time&&previous.url!==e.url)conflicts.add(key);else if(!previous)aliases.set(key,e);
 }
 const baseKey=e=>e.date+'|'+eventIdentityTitle(e).replace(/[^a-z0-9:]/g,'')+'|'+norm(e.county||e.city);
 const established=new Set(prepared.filter(e=>!e.occurrenceTime&&!e.coverage).map(baseKey)),seen=new Map();
 for(const e of prepared){
  const conflict=conflictingEntity(e);if(conflict&&conflicts.has(conflict))continue;
  const base=baseKey(e),market=eventIdentityTitle(e).startsWith('market:');
  if(e.occurrenceTime&&established.has(base))continue;
  const key=eventAliasKey(e)||(conflict?'festival:'+conflict+'|'+e.time:'')||base+(e.occurrenceTime&&!market?'|'+e.occurrenceTime+'|'+norm(e.venue):'');
  const previous=seen.get(key);
  if(!previous){seen.set(key,e);continue}
  const rank=x=>(x.coverage?0:10)+(x.endTime?2:0)+(x.address?1:0);
  if(rank(e)>rank(previous))seen.set(key,e);
 }
 return [...seen.values()].sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'99:99').localeCompare(b.time||'99:99')||a.title.localeCompare(b.title));
}

function options(select,values,label,current){
 select.replaceChildren();
 const all=document.createElement('option');
 all.value='';all.textContent=label;

  o.value=value;

 }

function easternClock(){
 const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(x=>[x.type,x.value]));
 return p.hour+':'+p.minute;
}
// An event that ended earlier today has expired. Overnight events
// (end time before start time) are kept.
function endedToday(e){
 if(e.date!==localISO(new Date())||!e.endTime)return false;
 if(e.time&&e.endTime<=e.time)return false;
 return e.endTime<=easternClock();
}
function matches(e){
 if(endedToday(e))return false;
 if(state.day==='weekend'){
  // The Friday/Saturday/Sunday in the current seven-day window.
  // On Saturday or Sunday, show the remaining current weekend days;
  // on weekdays, show the next upcoming weekend.
  if(!weekendDays.has(e.date))return false;
 }else if(e.date!==days[Number(state.day)])return false;
 if(state.region&&e.state!==state.region)return false;
 if(state.county&&e.county!==state.county)return false;
 if(state.city&&e.city!==state.city)return false;
 if(state.type&&e.category!==state.type)return false;
 if(state.search&&![
  e.title,e.venue,e.address,e.city,
  e.county,e.description
 ].join(' ').toLowerCase().includes(state.search))
  return false;
 return true;
}

function el(tag,cls,text){

 else cards.scrollLeft=previousScroll;

let lastPublished='';
function publishSelection(e,force=false){

   id:e.id,title:e.title,date:e.date,
   startTime:e.time||null,endTime:e.endTime||null,
   venue:e.venue||null,address:e.address||null,
   city:e.city||null,county:e.county||null,
   state:e.state||null,latitude:e.lat,
   longitude:e.lng,source:e.source,url:e.url,
   dateConfidence:e.confidence
  };
 // v23: re-renders during loading re-sent the same selection dozens of times,
 // and the forecast module redrew on each one. Send only real changes.
 const signature=JSON.stringify(detail);
 if(signature===lastPublished&&!force)return;  // a reader's click always sends
 lastPublished=signature;
 window.dispatchEvent(new CustomEvent('cw:event-selected',{detail}));

function selectEvent(e,showDetails=false){

 if(eventIndex>=0)state.scrollColumn=Math.floor(eventIndex/columns);
 state.selected=e.id;
 state.userSelected=true;
 state.detailOpenId=showDetails?e.id:null;
 render();
 if(!showDetails){
  detail.hidden=true;

 const loc=[e.venue,e.address,e.city,
  e.county,e.state].filter(Boolean);
 detail.append(el('p','',
  'Location: '+([...new Set(loc)].join(' · ')||
   'Not confirmed')
 ));

 if(e.description){
  const excerpt=descriptionExcerpt(e.description,30);
  detail.append(el('p','',excerpt.text));

 const source=el('p','','Source: ');
 if(e.url)source.append(

 );

 const scheduleNote=el('p','', 'Verify the schedule with organizer');
 scheduleNote.style.fontStyle='italic';
 detail.append(scheduleNote);

}

// Select the top event only when a NEW column reaches about 40%
// of a tile width from the left edge. Update selection in place: rebuilding cards during
// scrolling would interrupt momentum and cause delayed/jumpy selection.
let scrollSelectionFrame=0;
function updateScrollSelection(){
 scrollSelectionFrame=0;
 const visible=state.events.filter(matches);
 const nodes=[...cards.querySelectorAll('.cwe-card')];
 if(!nodes.length)return;
 const desktop=!window.matchMedia('(max-width:620px)').matches;
 const stride=desktop?3:1;
 const edge=desktop?cards.getBoundingClientRect().top:cards.getBoundingClientRect().left;
 const size=desktop?nodes[0].getBoundingClientRect().height:nodes[0].getBoundingClientRect().width;
 const threshold=edge+size*0.4;
 let nearest=0;
 for(let i=0;i<nodes.length;i+=stride){
  const pos=desktop?nodes[i].getBoundingClientRect().top:nodes[i].getBoundingClientRect().left;
  if(pos<=threshold)nearest=i;
  else break;
 }
 const group=Math.floor(nearest/stride);
 if(group===state.scrollColumn)return;
 state.scrollColumn=group;
 const chosen=visible[nearest];
 if(!chosen||chosen.id===state.selected)return;
 state.selected=chosen.id;
 state.userSelected=true;
 nodes.forEach((node,i)=>node.classList.toggle('selected',i===nearest));
 detail.hidden=true;detail.replaceChildren();publishSelection(chosen);
}
window.matchMedia('(max-width:620px)').addEventListener('change',()=>{
 cards.scrollLeft=0;cards.scrollTop=0;state.scrollColumn=0;render();
});
cards.addEventListener('scroll',()=>{
 if(scrollSelectionFrame)return;
 scrollSelectionFrame=requestAnimationFrame(updateScrollSelection);
},{passive:true});
function moveEventColumn(direction){
 const nodes=[...cards.querySelectorAll('.cwe-card')];
 if(!nodes.length)return;
 const desktop=!window.matchMedia('(max-width:620px)').matches;
 const stride=desktop?3:1;
 const first=desktop?nodes[0].offsetTop:nodes[0].offsetLeft;
 const positions=[];
 for(let i=0;i<nodes.length;i+=stride){
  positions.push((desktop?nodes[i].offsetTop:nodes[i].offsetLeft)-first);
 }
 const current=desktop?cards.scrollTop:cards.scrollLeft;
 const tolerance=3;
 let target=direction>0?positions.find(x=>x>current+tolerance):[...positions].reverse().find(x=>x<current-tolerance);
 if(target===undefined)target=direction>0?positions[positions.length-1]:0;
 cards.scrollTo(desktop?{top:target,behavior:'smooth'}:{left:target,behavior:'smooth'});
}

/* Accessible source diagnostics, including Reston fetch and parsing outcomes. */
const diagnosticButton=$('#cwe-diagnostics-button');
const diagnosticPanel=$('#cwe-diagnostics');
/* One outcome per source:
 *  BLOCKED BY PUBLISHER · ACCESS FAILED · PARTIAL — time limit reached
 *  EVENTS FOUND (optionally "coverage incomplete")
 *  COMPLETED — none qualified this week (listings existed, none passed checks)
 *  COMPLETED — no listings this week (calendar read; nothing in the window)
 *  ZERO — coverage incomplete / not measured (zero, but cannot vouch for it) */
function diagnosticStatus(r){
 if(r.blocked)return 'BLOCKED BY PUBLISHER';
 if(r.ok===false&&r.partial)return 'PARTIAL — time limit reached';
 if(r.ok===false)return 'ACCESS FAILED';
 const st={...r,...(state.coverageStages?.[r.source]||{})};
 const incomplete=r.partial||r.limited||r.discoveryComplete===false||!!st.detailAccessFailures||!!r.error;
 if((r.count||0)>0)return incomplete?'EVENTS FOUND — coverage incomplete':'EVENTS FOUND';
 if(r.collector&&r.candidates)return 'EVENTS FOUND — listed under each publisher';
 if(r.collector&&!r.candidates)return 'COMPLETED — none qualified this week';
 if(incomplete)return 'ZERO — coverage incomplete';
 if(r.adapter)return r.inRange?'COMPLETED — none qualified this week':'COMPLETED — no listings this week';
 if(r.inRange===0&&r.discovered!==undefined)return 'COMPLETED — no listings this week';
 if(r.inRange>0||st.indoorOrMixed||st.insufficientEvidence||st.missingSchedule||st.missingLocation||st.conflictingSchedule)return 'COMPLETED — none qualified this week';
 return 'ZERO — coverage not measured';
}
function updateSourceDiagnostics(){
 const displaySources=new Map();
 for(const e of state.events)displaySources.set(e.source,(displaySources.get(e.source)||0)+1);
 for(const r of state.reports)r.count=displaySources.get(r.source.replace(/ calendar$/,''))||0;
 if(diagnosticPanel.hidden)return;
 const lines=[

async function recoverPGVenue(item,source){

/* ---------------------------------------------------------------------

function spanDays(a,b){return Math.round((Date.parse(b+'T12:00:00Z')-Date.parse(a+'T12:00:00Z'))/864e5)}

function leafList(node){
 if(!node)return [];
 const out=[],walker=node.ownerDocument.createTreeWalker(node,NodeFilter.SHOW_TEXT);

  const p=n.parentElement;
  if(!p||/^(?:SCRIPT|STYLE|NOSCRIPT|TITLE|TEMPLATE)$/.test(p.tagName)||p.closest('svg'))continue;

/* Outdoor public-space evidence, used only by v20 adapters: a scheduled
 * activity whose publisher-stated location is itself an outdoor public space
 * (a park, plaza, square, pier, field, street) and not a building. */
const PUBLIC_SPACE=/\b(?:park|plaza|square|green|commons|lawn|pier|boardwalk|promenade|waterfront|gardens?|trail|farm|orchard|meadow|field|fairgrounds?|amphitheat(?:er|re)|alley)\b/i;
const NAMED_STREET=/^(?:on\s+)?[A-Z][\w.'’-]*(?:\s+[A-Z][\w.'’-]*)*\s+(?:Street|Avenue|Boulevard|Row|Way)\b/;
const BUILDING_WORDS=/\b(?:center|centre|hall|building|church|school|library|museum|theat(?:er|re)|arena|gym|gymnasium|store|shop|restaurant|bar|brewery|brewing|winery|cidery|hotel|mall|office|suite|room|lobby|lodge|club|studio|gallery|cafe|café|tavern|pub|kitchen|bowl|lanes|house|manor|mansion|brewhouse|taproom|conservatory|greenhouse)\b/i;
const OUTDOOR_ACTIVITY=/\b(?:festival|fest|fair|market|parade|concert|music|jazz|band|dj|movies?|film|cinema|food trucks?|trick.or.treat|trunk.or.treat|candy hunt|egg hunt|scavenger hunt|costume|carnival|celebration|bash|stroll|walk|hike|run|race|5k|yoga|fitness|games|mahjong|picnic|habitat restoration|invasive|clean.?up|tree planting|hayrides?|pumpkins?|corn maze|skating|tour|night market|mini golf|haunted trail|campfire|naturalist|bird(?:ing)? walk)\b/i;
function publicSpaceEvidence(c){
 const places=[c.venue,c.activityLocation].map(clean).filter(Boolean);
 // v22: a building venue makes a title's place name a pun, not a location
 // ("Nightmare on East Street" at a brewhouse).
 const venueIsBuilding=BUILDING_WORDS.test(clean(c.venue).split(/,|\s+\d{2,6}\s/)[0]);
 const titled=!venueIsBuilding&&clean(c.title).match(/\b(?:at|in|on)\s+((?:[A-Z][\w.'’-]*\s+){0,4}(?:Park|Plaza|Square|Green|Commons|Pier|Boardwalk|Field|Street|Avenue))\b/);
 if(titled)places.push(titled[1]);
 // A location the publisher states in the description ("at the Dog Park").
 const stated=clean(c.description).slice(0,600).match(/\b(?:at|in)\s+(?:the\s+)?((?:[A-Z][\w.'’-]*\s+){1,4}(?:Park|Plaza|Square|Green|Commons|Pier|Boardwalk|Field|Gardens?|Trail|Farm|Lawn|Amphitheater))\b/);
 if(stated)places.push(stated[1]);
 const activity=(clean(c.title)+' '+clean(c.description).slice(0,700)).match(OUTDOOR_ACTIVITY);
 if(!activity)return '';
 // v21: a park is not evidence for a workshop, class or a program held in the
 // park's nature center or visitor center ("snakes that call the nature
 // center home", "a paper-quilling workshop" at a garden park).
 if(/\b(?:workshops?|classroom|lecture|seminar|bus tour|crafts? of the past|wood carving|leather working|basket weaving|paper making)\b/i.test(c.title+' '+c.description)||
    /\b(?:nature center|visitor center|exhibit hall)\b/i.test(c.description))return '';
 for(const p of places){
  const head=p.split(/,|\s+\d{2,6}\s/)[0];
  if(INDOOR_VENUE.test(p)||BUILDING_WORDS.test(head))continue;
  if((PUBLIC_SPACE.test(head)&&!/^\d/.test(head))||NAMED_STREET.test(head))

}
/* Final eligibility for adapter candidates. Returns the candidate with its
 * in-window dates, or null after recording the reason. */
function admitPublisher(source,r,c,categoryEvidence=''){
 c={source:source.name,city:source.city||'',county:source.county,state:source.state,categories:'',
  venue:'',address:'',description:'',time:'',endTime:'',lat:null,lng:null,needsDetail:false,...c};
 c.title=decodeEventText(clean(c.title));c.description=decodeEventText(clean(c.description));
 c.venue=decodeEventText(clean(c.venue));c.address=clean(c.address);c.url=safeURL(c.url);
 c.dates=[...new Set((c.dates||[]).filter(d=>days.includes(d)))];
 const reject=(key,label)=>{r[key]=(r[key]||0)+Math.max(1,c.dates.length);sampleLegacyReject(c,label||key,null);return null};
 if(!c.title||!c.url)return reject('missingSchedule','missing title or link');
 if(/freshfarm/i.test(c.title+' '+c.venue)){bumpExtra(r,'FRESHFARM excluded',c.dates.length||1);return null}
 if(/\b(?:cancell?ed|postponed|closed)\b/i.test(c.title))return reject('cancelled','cancelled or closed');
 if(!c.dates.length)return reject('missingSchedule','no publisher date in the seven-day window');
 if(!c.venue&&!c.address)return reject('missingLocation','missing location');
 if(outdoorDenial(c))return reject('indoorOrMixed','indoor or mixed indoor/outdoor');
 if(c.venue&&INDOOR_VENUE.test(c.venue))return reject('indoorOrMixed','indoor venue');
 // Tours that go inside a building are mixed indoor/outdoor programs.
 if(/\b(?:access to|tour of|inside|interior of)\b[^.!?]{0,70}\b(?:lodge|museum|house|mansion|church|hall|building|mill|tavern|conservatory|greenhouse)\b/i.test(c.title+' '+c.description.slice(0,600))||
    /\b(?:conservatory|greenhouse|house|mansion|museum)\s+tours?\b/i.test(c.title))
  return reject('indoorOrMixed','tour includes time inside a building');
 // v25: events at a known open-air stadium or amphitheater (Audi Field, Merriweather, Jiffy Lube Live…).
 const openAirVenue=TM_OUTDOOR_VENUE.test(c.venue)&&!/\b(?:club level|suite|indoor|lounge|press conference)\b/i.test(c.title)?'Held at an open-air stadium or amphitheater ('+c.venue+')':'';
 const evidence=categoryEvidence||outdoorEvidence(c)||legacyOutdoorEvidence(c)||publicSpaceEvidence(c)||openAirVenue;
 if(!evidence)return reject('insufficientEvidence','no publisher evidence the activity is outdoors');

 applyAddress(c);

}
function adapterEvents(cands){return cands.filter(Boolean).flatMap(c=>c.dates.map(d=>createEvent(c,d,c.dateEvidence||'Publisher calendar')))}

/* DowntownDC: the list view filtered to the BID's own Outdoor category (cat=380).

async function adaptDowntownDC(source,r){
 const base='https://www.downtowndc.org';
 const groups=new Map();
 for(const month of [...new Set(days.map(d=>d.slice(0,7)))]){
  const doc=docFrom(await adapterFetch(r,base+'/events/?view=list&cat=380&month='+month,12000));
  if(!doc.querySelector('#events-results,.event-card'))throw Error('Calendar list structure not recognized');
  for(const card of doc.querySelectorAll('.event-card[data-date]')){
   r.discovered++;

   const a=card.querySelector('.event-card__title a[href]');
   const url=a&&safeURL(absURL(a.getAttribute('href'),base));if(!url)continue;

   if(!g.dates.includes(iso))g.dates.push(iso);

  }

 await eachLimit([...groups],3,async([url,g])=>{
  if(/freshfarm/i.test(g.title)){bumpExtra(r,'FRESHFARM excluded',g.dates.length);return}
  let doc;
  try{doc=docFrom(await adapterFetch(r,url,10000))}catch(e){r.detailAccessFailures++;sampleLegacyReject({source:source.name,title:g.title,url,dates:g.dates},'detail page failed: '+e.message);return}
  const hero=doc.querySelector('.event-hero')||doc.body;
  const dates=[...hero.querySelectorAll('.date-time .date')].map(x=>fullDate(textOf(x))).filter(Boolean);
  const times=[...hero.querySelectorAll('.date-time .time')].map(x=>parseTime(textOf(x))).filter(Boolean);
  const venue=textOf(hero.querySelector('.location'));
  const full=textOf(doc.querySelector('main')||doc.body);

  const start=dates[0]||'',end=dates[dates.length-1]||start;

  const iso=text.match(/(\d{4}-\d\d-\d\d)T(\d\d:\d\d):\d\d\s+(\d{4}-\d\d-\d\d)T(\d\d:\d\d):\d\d/);
  if(!iso||iso[1]!==t.date){r.conflictingSchedule++;sampleLegacyReject({source:source.name,title:t.title,url:t.url,dates:[t.date]},'event page date differs from the listing');return}
  // "Directory Location Ellanor C. Lawrence Park Location Visitor Center &
  // Amphitheater Chantilly, VA 20151": the town is the longest known town name
  // ending the chunk; the park comes before " Location ", the area after it.
  const loc=text.match(/Directory Location\s+(.{3,200}?),\s*VA,?\s*(\d{5})/);
  let venue='',area='',city='';
  if(loc){
   const words=clean(loc[1]).split(' ');
   for(let n=3;n>=1&&!city;n--){const tail=words.slice(-n).join(' ');if(words.length>n&&countyFor(tail,'VA'))city=tail}
   if(!city)city=words[words.length-1];
   const head=words.slice(0,words.length-city.split(' ').length).join(' ');
   [venue,area='']=head.split(/\s+Location\s+/);
  }
  let description=t.excerpt;
  if(loc){const after=text.slice(text.indexOf(loc[0])+loc[0].length);description=clean(after.split(/\s+(?:Registration:|Add to calendar|Click to view)/)[0]).slice(0,1500)||t.excerpt}
  out.push(admitPublisher(source,r,{title:t.title,url:t.url,venue,address:[area,loc?city+', VA '+loc[2]:''].filter(Boolean).join(', '),
   activityLocation:venue,city,county:'Fairfax County',state:'VA',description,
   dates:[t.date],time:iso[2],endTime:iso[3]===iso[1]?iso[4]:'',dateEvidence:'Fairfax County Park Authority event page'}));
 });
 return adapterEvents(out);
}

/* v22: daily collector file. Each record is what the publisher's own event
 * page states; the usual date, location and outdoor checks still apply here. */
/* v23: one shared request for the collector file. */
let collectorFilePromise=null;
function collectorFile(){
 if(COLLECT_MODE||!COLLECTOR_URL)return Promise.resolve({file:null,error:'off'});
 return collectorFilePromise||=(async()=>{
  try{
   // Revalidate (a cheap 304 when unchanged) so a new daily file is seen at once.
   const r=await netText(COLLECTOR_URL,10000,{cache:'no-cache'});
   if(!r.ok)throw Error('HTTP '+r.status);
   const file=JSON.parse(r.text);
   if(file?.schemaVersion!==1||!Array.isArray(file.events))return {file:null,error:'Collector file format not recognized'};
   return {file};
  }catch(err){return {file:null,error:String(err?.message||err)}}
 })();
}
/* v23: sources the daily collector reads by running this widget headless.
 * When its file is fresh and the source completed there, the browser uses
 * those already-screened events instead of loading the source itself; when
 * the file is missing, stale or the source failed there, the source loads live
 * as before. */
const COLLECTED_SOURCES=new Set(['National Landing BID','City of Fairfax','George Washington’s Mount Vernon','NPS DC-area parks','Visit Alexandria','M-NCPPC Prince George’s Parks','Visit Montgomery','Visit Fredericksburg','Reston Town Center','Downtown Silver Spring']);
async function fromCollector(name){
 if(!COLLECTED_SOURCES.has(name))return false;
 const {file}=await collectorFile();
 const group=file?.screened;
 const ageH=group?(Date.now()-Date.parse(group.generatedAt))/36e5:Infinity;
 const status=group?.sources?.[name];
 if(!(ageH<COLLECTOR_MAX_AGE_HOURS)||!status?.ok)return false;
 const events=(group.events||[]).filter(e=>e.source===name&&validISO(e.date)&&days.includes(e.date)).map(e=>({...e}));
 if(events.length){state.events=dedupe([...state.events,...events]);geography();render()}
 state.reports.push({source:name,ok:true,collector:true,candidates:events.length,count:0,requests:0,
  discoveryComplete:true,outcome:'Read by the daily collector ('+new Date(group.generatedAt).toLocaleString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' ET): '+status.status});
 return true;
}
async function adaptCollector(source,r){
 r.requests++;
 const {file,error}=await collectorFile();
 if(!file)throw Error(error||'Collector file unavailable');
 const ageH=(Date.now()-Date.parse(file.generatedAt))/36e5;
 if(!(ageH<COLLECTOR_MAX_AGE_HOURS)){r.outcome='Collector file is '+(isFinite(ageH)?Math.round(ageH)+' hours':'of unknown age')+' old; not used';return []}
 const sites=(file.sources||[]).map(x=>x.source+': '+x.status+(x.inWindow!=null?' ('+x.inWindow+')':'')).join(' · ');
 if(sites)bumpExtra(r,'['+sites+']',0);
 const out=[];
 for(const rec of file.events){
  r.discovered++;
  const dates=(rec.dates||[]).filter(d=>validISO(d)&&days.includes(d));
  if(!dates.length)continue;
  r.inRange+=dates.length;
  const st=['DC','MD','VA'].includes(rec.state)?rec.state:'';
  const city=clean(rec.city||'');
  // A stated town outside the coverage area is rejected, not filed under the
  // tourism office's county.
  const county=city&&st?countyFor(city,st):'';
  if(city&&st&&!county){bumpExtra(r,'outside the coverage area',dates.length);continue}
  const site={name:clean(rec.source)||'Daily collector',city:'',county:county||rec.siteCounty||'',state:st};
  // v24: FindLocal classifies venues ("Park & Outdoors") and events
  // ("outdoor_activity"); either counts as outdoor evidence, after the usual
  // indoor and building checks in admitPublisher.
  // A park's venue type does not make a nature-center talk or exhibit outdoors.
  // (Live-animal programs such as snake feedings are nature-center programs.)
  const insideCue=/\b(?:nature center|visitor center|museum|exhibit(?:ion)?|indoors?|auditorium|classroom|library|serpents?|snakes?|reptiles?|live animals?)\b/i.test(rec.title+' '+(rec.description||''))||/\b(?:mill)\b/i.test(rec.venue||'')||BUILDING_WORDS.test(clean(rec.venue||''));
  // Ranger talks with no stated time, and titles naming a building ("the Old
  // Stone House"), need the description itself to place them outdoors.
  const hint=rec.outdoorHint&&!insideCue&&!BUILDING_WORDS.test(clean(rec.title||''))&&/^\d\d:\d\d$/.test(rec.time||'')&&rec.time!=='00:00'?'FindLocal lists this as '+rec.outdoorHint:'';
  out.push(admitPublisher(site,r,{title:rec.title,url:rec.url,venue:rec.venue||'',address:rec.address||'',
   activityLocation:rec.venue||'',city,county:county||rec.siteCounty||'',state:st,description:rec.description||'',
   categories:rec.categories||'',lat:rec.lat,lng:rec.lng,dates,time:/^\d\d:\d\d$/.test(rec.time||'')&&rec.time!=='00:00'?rec.time:'',
   endTime:/^\d\d:\d\d$/.test(rec.endTime||'')?rec.endTime:'',viaFindLocal:rec.source==='FindLocal',
   dateEvidence:rec.source==='FindLocal'?'FindLocal event listing (from the venue’s own calendar)':'Publisher event page (read by the daily collector)'},hint));
 }
 const kept=out.filter(Boolean).length;
 r.collector=true;
 // Accepted events are shown under each publisher's name, not this row's.
 r.outcome=kept?kept+' events passed the checks; they are listed under each publisher\'s name':'';
 return adapterEvents(out);
}


/* v24: National Landing BID (Crystal City, Pentagon City). The "next 7 days"
 * list shows each event, or the next date of a weekly one, with its start in
 * <time datetime>; the event page adds the time range and description. */
async function adaptNationalLanding(source,r){
 const base='https://www.nationallanding.org';
 const todo=new Map();
 for(let page=1;page<=4;page++){
  const doc=docFrom(await adapterFetch(r,base+'/events?date=next7days&page='+page,12000));
  const cards=[...doc.querySelectorAll('.event-card')];
  if(!cards.length){if(page===1)throw Error('Event cards not found');break}
  let fresh=0;
  for(const c of cards){
   r.discovered++;
   const a=c.querySelector('.event-card__link[href]');
   const url=a&&safeURL(absURL(a.getAttribute('href'),base));
   const dt=c.querySelector('time[datetime]')?.getAttribute('datetime')||'';
   const date=dt.slice(0,10);
   if(!url||!validISO(date)||!days.includes(date)||todo.has(url+'|'+date))continue;
   fresh++;r.inRange++;
   // The listed clock time is local even though the attribute says +00:00.
   todo.set(url+'|'+date,{url,date,title:textOf(a).replace(/\s*→\s*$/,''),clock:dt.slice(11,16)});
  }
  if(!fresh)break;
 }
 const out=[];
 await eachLimit([...todo.values()].slice(0,30),3,async t=>{
  let description='',timeText='';
  try{
   const d=docFrom(await adapterFetch(r,t.url,10000));
   description=textOf(d.querySelector('.event-details__description'));
   timeText=[...d.querySelectorAll('.event-details__pill')].map(textOf).find(x=>/^Time:/i.test(x))||'';
  }catch(e){r.detailAccessFailures++}
  const tr=clockRange(timeText.replace(/^Time:\s*/i,''));
  const at=t.title.match(/\s(?:@|at)\s+(.{3,60})$/);
  const named=(t.title+' '+description).match(/\b(Met Park|Water Park|Long Bridge Park|Gravelly Point|Crystal City Water Park|Virginia Highlands Park|Pentagon Row|Pentagon City|Crystal Drive|Potomac Yard)\b/);
  const venue=at?clean(at[1]):named?named[1]:'National Landing';
  out.push(admitPublisher(source,r,{title:t.title,url:t.url,venue,address:venue+', National Landing, Arlington, VA',
   activityLocation:venue,city:'Arlington',county:'Arlington County',state:'VA',description,dates:[t.date],
   time:tr.start||(t.clock&&t.clock!=='00:00'?t.clock:''),endTime:tr.end,dateEvidence:'National Landing BID calendar date'}));
 });
 return adapterEvents(out);
}

/* v24: George Washington's Mount Vernon. Each event page carries a schema.org
 * Event with start and end times. */
async function adaptMountVernon(source,r){
 const base='https://www.mountvernon.org';
 const doc=docFrom(await adapterFetch(r,base+'/plan-your-visit/calendar/events',12000));
 const links=[...new Set([...doc.querySelectorAll('a[href*="/calendar/events/"]')].map(a=>safeURL(absURL(a.getAttribute('href'),base))).filter(Boolean))];
 if(!links.length)throw Error('Event list not recognized');
 r.discovered=links.length;
 const out=[];
 await eachLimit(links.slice(0,25),3,async url=>{
  let html='';
  try{html=await adapterFetch(r,url,10000)}catch(e){r.detailAccessFailures++;return}
  const d=docFrom(html);let ev=null;
  for(const s of d.querySelectorAll('script[type="application/ld+json"]')){
   try{const j=JSON.parse(s.textContent);ev=(j['@graph']||[j]).find(x=>x&&x['@type']==='Event');if(ev)break}catch{}
  }
  if(!ev)return;
  const a=schemaDateTime(ev.startDate),b=schemaDateTime(ev.endDate);
  if(!a.date)return;
  const end=b.date||a.date;
  if(spanDays(a.date,end)>3){r.inRange+=windowDates(a.date,end).length;bumpExtra(r,'multi-day range without daily schedule');return}
  const occ=windowDates(a.date,end);if(!occ.length)return;
  r.inRange+=occ.length;
  const loc=ev.location||{},addr=loc.address||{};
  out.push(admitPublisher(source,r,{title:decodeEventText(clean(ev.name)),url,venue:clean(loc.name)||'George Washington’s Mount Vernon',
   address:[addr.streetAddress,addr.addressLocality,addr.addressRegion].filter(Boolean).join(', '),
   activityLocation:clean(loc.name),city:'Mount Vernon',county:'Fairfax County',state:'VA',
   description:textOf(d.querySelector('main'))?.slice(0,1500)||clean(ev.description),
   lat:Number(loc.geo?.latitude)||null,lng:Number(loc.geo?.longitude)||null,dates:occ,
   time:a.time,endTime:b.date===a.date&&b.time>a.time?b.time:'',dateEvidence:'Mount Vernon event page schema.org dates'}));
 });
 return adapterEvents(out);
}

const ADAPTERS={nationalLanding:adaptNationalLanding,mountVernon:adaptMountVernon,collector:adaptCollector,novaParks:adaptNOVAParks,fairfaxParks:adaptFairfaxParks,downtownDC:adaptDowntownDC,navyYard:adaptNavyYard,wharf:adaptWharf,vienna:adaptVienna,
 civicRSS:adaptCivicRSS,merriweather:adaptMerriweather,fredericksburg:adaptFredericksburg,tribe:adaptTribe,
 goldenTriangle:adaptGoldenTriangle,ctyCards:adaptCTYCards,occoquan:adaptOccoquan,probe:adaptProbe};

async function runAdapter(source){
 if(await fromCollector(source.name))return [];
 if(COLLECT_MODE&&!COLLECTED_SOURCES.has(source.name))return [];
 const r=adapterReport(source),began=performance.now();
 let events=[],timer;
 try{
  const deadline=new Promise((_,reject)=>{timer=setTimeout(()=>reject(Object.assign(Error('Stopped at the '+ADAPTER_DEADLINE/1000+'-second source limit'),{deadline:true})),ADAPTER_DEADLINE)});
  events=await Promise.race([ADAPTERS[source.adapter](source,r),deadline])||[];
  r.ok=true;
 }catch(err){
  const msg=String(err?.message||err);
  r.error=msg;r.ok=false;
  if(/HTTP 40[13]/.test(msg)){r.blocked=true;r.outcome='Publisher refuses requests from other websites and from the CORS proxy ('+msg.replace(/\s*\(.*$/,'')+'). Not bypassed.'}
  else if(err?.deadline){r.partial=true;r.outcome=msg}
  else r.outcome='Calendar could not be read: '+msg;
 }finally{clearTimeout(timer)}
 r.ms=Math.round(performance.now()-began);
 r.candidates=events.length;
 r.discoveryComplete=r.ok&&!r.limited;
 if(r.ok&&!r.outcome)r.outcome=events.length?'':r.inRange?'Listings in the window, but none passed the date, location and outdoor checks':'Publisher lists no events in the seven-day window';
 const extra=Object.entries(r.extra).map(([k,v])=>v?v+' '+k:k).join(' · ');
 r.detail=(source.formerly?'('+source.formerly+') ':'')+r.discovered+' listings · '+r.inRange+' in-window occurrences · '+events.length+' event slots accepted · '+r.requests+' requests · '+r.ms+' ms'+(extra?' · '+extra:'');
 return events;
}

async function cwExpansionRun(){
 let index=0;
 async function worker(){while(index<CW_EXPANSION_SOURCES.length){
  const source=CW_EXPANSION_SOURCES[index++];
  try{
   const events=source.adapter?await runAdapter(source):await cwExpansionLoad(source);
   if(events.length){state.events=dedupe([...state.events,...events]);geography();render()}
  }catch(e){console.warn('Expansion failed',source.name,e)}
  finally{state.sourcesDone++}
  for(const r of state.reports)if(CW_EXPANSION_SOURCES.some(s=>s.name===r.source))r.count=state.events.filter(e=>e.source===r.source).length;
  render();updateSourceDiagnostics();
 }}
 await Promise.all([worker(),worker(),worker(),worker()]);
}

/* Lightweight JSON export for a future scheduled GitHub/Playwright collector.
 * No network requests, timers, event listeners or serialization on page load.
 * In browser automation: await collection completion, then call
 * window.cwExportEvents() to receive a validated JSON-compatible snapshot.
 * Calling with {download:true} explicitly downloads the snapshot manually.
 */
window.cwExportEvents=function({download=false,full=false}={}){
 const snapshot={schemaVersion:1,generatedAt:new Date().toISOString(),
  collectionComplete:!state.enriching,
  window:{first:days[0],last:days[days.length-1]},
  count:state.events.length,
  events:full?JSON.parse(JSON.stringify(state.events)):state.events.map(e=>({
   id:e.id,title:e.title,date:e.date,time:e.time||'',endTime:e.endTime||'',
   venue:e.venue||'',address:e.address||'',city:e.city||'',county:e.county||'',
   state:e.state||'',description:e.description||'',source:e.source||'',
   url:e.url||'',category:e.category||'',lat:e.lat??null,lng:e.lng??null,
   confidence:e.confidence||'',outdoorNote:e.outdoorNote||'',
   outdoorCardNote:e.outdoorCardNote||''
  })),
  sources:state.reports.map(r=>({source:r.source,status:diagnosticStatus(r),ok:!!r.ok,blocked:!!r.blocked,count:r.count||0,
   candidates:r.candidates||0,outcome:r.outcome||'',ms:r.ms??null,error:r.error||''})),
  network:{requests:net.requests,proxy:net.proxy,direct:net.direct,backup:net.backup,timeouts:net.timeouts,errors:net.errors,peak:net.peak},
  finishedMs:state.finishedMs};
 if(download){
  const blob=new Blob([JSON.stringify(snapshot,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='capital-weather-events.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
 }
 return snapshot;
};

/* Load public tourism, HSEMA, and Ticketmaster sources independently. */

async function load(){
 const verifiedSources=loadVerifiedSources();
 const sourceDone=()=>{state.sourcesDone++;render()};
 const princeWilliam=loadPrinceWilliamImGoing().then(events=>{
  if(events.length){state.events=dedupe([...state.events,...events]);geography();render()}
 }).finally(sourceDone);
 const newSources=Promise.all([loadHSEMA().finally(sourceDone),loadTicketmaster().finally(sourceDone)]).then(groups=>{
  state.events=dedupe([...state.events,...groups.flat()]);
  geography();render();
 });
 const tourismSources=[
  ...FEEDS.filter(source=>!COVERAGE_SOURCES.some(s=>s.name===source.name)).map(source=>()=>loadFeed(source)),
  ...NEIGHBORHOOD_CALENDARS.filter(source=>!ROUND2_SOURCES.some(s=>s.name===source.name)).map(source=>()=>loadNeighborhood(source)),
  ...BID_SOURCES.filter(source=>!COVERAGE_SOURCES.some(s=>s.name===source.name)).map(source=>()=>source.name==='Rosslyn BID'?loadRosslyn(source):source.name==='Downtown Silver Spring'?loadSilverSpring(source):source.name==='Georgetown BID'?loadGeorgetown(source):source.name==='Reston Town Center'?loadReston(source):loadBid(source)),
  ...CALENDAR_SOURCES.map(source=>()=>loadCalendar(source))
 ];

 // Start processing each source as soon as it finishes. Previously a single
 // slow calendar blocked ALL tourism sources via Promise.all().
 const seenCandidates=new Set();
 const workQueue=[];
 let active=0, sourcesRemaining=tourismSources.length;
 let pending=[], lastFlush=0, flushTimer=null;
 // Every loader below increments sourcesDone exactly once when it settles.
 state.sourceTotal=VERIFIED_SOURCES.length+3+tourismSources.length+CW_EXPANSION_SOURCES.length;
 state.enriching=true;
 render();
 // Launch the expansion pool immediately rather than waiting for all 27
 // established sources and their individual detail-page checks to finish.
 // Its four bounded workers remain independent of the baseline pipeline.
 const expansionTask=cwExpansionRun().catch(err=>console.warn('Expansion pool failed',err));

 function flush(){
  if(flushTimer){clearTimeout(flushTimer);flushTimer=null;}
  if(pending.length){
   state.events=dedupe([...state.events,...pending]);
   pending=[];
   for(const report of state.reports){
    if(report.ok)report.count=state.events.filter(e=>e.source===report.source.replace(/ calendar$/,'')).length;
   }
   geography();render();
  }
  lastFlush=Date.now();
 }
 function scheduleFlush(immediate=false){
  if(immediate || Date.now()-lastFlush>600){flush();return;}
  if(!flushTimer)flushTimer=setTimeout(flush,350);
 }
 let doneResolve;
 const allDone=new Promise(resolve=>{doneResolve=resolve});
 function checkDone(){
  if(sourcesRemaining===0 && active===0 && workQueue.length===0)doneResolve();
 }
 function pump(){
  while(active<4 && workQueue.length){
   const candidate=workQueue.shift();active++;
   (async()=>{
    try{
     // Calendar cards and API records already have dates and do not
     // require another request. RSS candidates still get page verification.
     const events=candidate.needsDetail===false
      ?(candidate.dates||[]).map(parseDate).filter(iso=>days.includes(iso)).map(iso=>createEvent(candidate,iso,candidate.dateEvidence||'Calendar date'))
      :await processCandidate(candidate);
     if(events.length){pending.push(...events);scheduleFlush(pending.length>=5);}
    }catch(e){console.warn('Event candidate processing failed',e);}
    finally{active--;pump();checkDone();}
   })();
  }
  checkDone();
 }
 // Limit simultaneous source discovery requests. Detail verification has its
 // own four-worker queue above; neither queue waits for slow sources to render.
 const SOURCE_CONCURRENCY=5;
 let nextSource=0;
 const sourceTimings=[];
 async function sourceWorker(){
  while(nextSource<tourismSources.length){
   const index=nextSource++;
   const start=tourismSources[index];
   const began=performance.now();
   try{
    const candidates=await start();
    for(const candidate of candidates||[]){
     const key=(candidate.url||'').replace(/\/$/,'').toLowerCase();
     if(!key||seenCandidates.has(key))continue;
     seenCandidates.add(key);
     workQueue.push(candidate);
    }
    workQueue.sort((a,b)=>Number((b.dates||[]).includes(today))-Number((a.dates||[]).includes(today)));
    pump();
   }catch(err){console.warn('Event source failed',err);}
   finally{
    sourceTimings[index]=Math.round(performance.now()-began);
    sourcesRemaining--;state.sourcesDone++;pump();checkDone();
   }
  }
 }
 const tasks=Array.from({length:Math.min(SOURCE_CONCURRENCY,tourismSources.length)},()=>sourceWorker());
 state.discoveryTimings=sourceTimings;
 await Promise.all(tasks);
 await allDone;
 await verifiedSources;
 flush();
 await Promise.allSettled([princeWilliam,newSources,expansionTask]);
 state.enriching=false;
 state.finishedMs=Math.round(performance.now()-state.started);
 render();
 updateSourceDiagnostics();
}

load().catch(err=>{
 $('#cwe-status').textContent=
  'Unable to load events: '+err.message;
});

})();
